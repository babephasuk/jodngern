<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จดเงินของเบ๊บ</title>
<meta name="theme-color" content="#2f5d50">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="จดเงิน">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#1d2622; --muted:#6b7a73; --line:#e1e7e4;
  --brand:#2f5d50; --brand-soft:#e3eeea; --inc:#1f8a5b; --exp:#c0392b; --warn:#b26a00;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121715; --card:#1b2220; --ink:#e7ecea; --muted:#9aa9a2; --line:#2b3532;
    --brand:#7fc3ae; --brand-soft:#23302c; --inc:#5fd39c; --exp:#ff8a7a; --warn:#f0b35a;
    --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:16px}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:700}
header small{color:var(--muted)}
main{padding:0 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.inc{color:var(--inc)} .exp{color:var(--exp)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.seg{display:flex;background:var(--brand-soft);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on[data-v="รายจ่าย"]{color:var(--exp)} .seg button.on[data-v="รายได้"]{color:var(--inc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;white-space:nowrap;font-size:15px}
.chip.on{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.label{font-size:13px;color:var(--muted);margin:12px 0 6px}
.field{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit}
.field:focus{outline:2px solid var(--brand);border-color:transparent}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card)}
.pick .ic{font-size:22px;width:28px;text-align:center}
.amount{display:flex;gap:6px;align-items:stretch}
.amount input{font-size:26px;font-weight:700;text-align:right;letter-spacing:.5px}
.amount .op{width:52px;border:1px solid var(--line);border-radius:12px;font-size:24px;font-weight:700;background:var(--card)}
.calc{text-align:right;font-size:14px;min-height:20px;margin-top:4px}
.meals{display:flex;gap:8px}
.meals button{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 4px;background:var(--card)}
.meals button.on{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.primary{width:100%;background:var(--brand);color:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:700;margin-top:14px}
@media (prefers-color-scheme: dark){ .primary{color:#0f1513} }
.primary:disabled{opacity:.55}
.ghost{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.danger{color:var(--exp);border-color:var(--exp)}
.daybar{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 6px;font-weight:600}
.daybar span{font-size:14px;font-weight:500}
.tx{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);width:100%;text-align:left}
.tx:first-child{border-top:0}
.tx .ic{font-size:22px;width:30px;text-align:center}
.tx .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.sum b{display:block;font-size:17px}
.sum small{color:var(--muted);font-size:12px}
.split{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.nav{display:flex;align-items:center;gap:8px}
.nav .lbl{flex:1;text-align:center;font-weight:700}
.nav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px}
.nav button:disabled{opacity:.35}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;padding:6px;border-radius:12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button b{font-size:20px;line-height:1}
.tabbar button.on{color:var(--brand);font-weight:700}
.tabbar button:disabled{opacity:.35}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:18px;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;font-size:14px;line-height:1.25;min-height:74px}
.tile .ic{font-size:24px;display:block;margin-bottom:3px}
.list button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 6px;border-bottom:1px solid var(--line)}
.grp{font-size:13px;color:var(--muted);margin:14px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:#1d2622;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;max-width:90vw;box-shadow:var(--shadow)}
.toast.err{background:#8e2a20}
.toast[hidden]{display:none}
.err-box{color:var(--exp);font-size:14px;margin-top:8px;white-space:pre-wrap}
.slip td{padding:6px 2px;vertical-align:middle}
.slip input[type=text]{width:120px;text-align:right;padding:8px}
.slip table{width:100%;border-collapse:collapse}
.tot{display:flex;justify-content:space-between;padding:4px 2px;font-size:15px}
.tot b{font-size:16px}
.skeleton{padding:40px 0;text-align:center;color:var(--muted)}
.empty{padding:26px 0;text-align:center;color:var(--muted)}
.dateline{display:flex;gap:8px;align-items:center}
.dateline input{flex:1}
.be{font-size:14px;color:var(--muted);white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:12px;font-size:20px}
/* หน้าล็อก / ตั้งค่าเครื่อง */
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.gbox{max-width:420px;margin:0 auto}
.gbox h2{font-size:22px;margin:8px 0 6px;text-align:center}
.gbox p{line-height:1.5}
.gbox .center{text-align:center}
.logo{font-size:52px;text-align:center;margin-top:24px}
.pin{font-size:26px;letter-spacing:10px;text-align:center}
.secret{-webkit-text-security:disc}
.linkbtn{display:block;margin:22px auto 0;color:var(--muted);text-decoration:underline;font-size:14px}
.small{font-size:13px}
body.locked > :not(#gate){visibility:hidden}
/* 2.5: โครงรอโหลด รายการรอส่ง ป้ายสถานะ */
.sk{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--line)}
.sk:first-child{border-top:0}
.sk i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line) 25%,var(--brand-soft) 50%,var(--line) 75%);background-size:300% 100%;animation:shim 1.2s linear infinite}
.sk .c{width:28px;height:28px;border-radius:50%}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion: reduce){ .sk i{animation:none} }
.tx.pending .t1::after{content:' ⏳';font-weight:400}
.tx.failed .t1::after{content:' ⚠️';font-weight:400}
.tx.pending .amt{opacity:.7}
.hdr{display:flex;align-items:center;gap:6px}
.syncbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px;white-space:nowrap}
.syncbtn.bad{border-color:var(--exp);color:var(--exp);font-weight:600}
.note-bar{font-size:13px;color:var(--muted);background:var(--brand-soft);border-radius:10px;padding:8px 10px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.note-bar.bad{color:var(--exp)}
.note-bar button{margin-left:auto;text-decoration:underline;font-size:13px}
.perf td{padding:5px 2px;font-size:14px;border-bottom:1px solid var(--line)}
.perf td:last-child{text-align:right;white-space:nowrap}
.perf table{width:100%;border-collapse:collapse}
/* เฟส 3: หน้าภาพรวม (สีกราฟ 3 ช่องแรกของชุดสีที่ตรวจตาบอดสีแล้ว ใช้คู่กับป้ายตัวเลขเสมอ) */
:root{ --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --cmp:#a3aeaa; --grid:#e8edeb; --ink2:#52514e; }
@media (prefers-color-scheme: dark){ :root{ --s1:#3987e5; --s2:#d95926; --s3:#199e70; --cmp:#6a7671; --grid:#2b3532; --ink2:#c3c2b7; } }
.ovtop{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 12px 10px;min-width:0}
.kpi.wide{grid-column:1 / -1}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:21px;font-weight:700;margin:2px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.kpi .key{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.ctitle b{font-size:16px}
.ctitle span{font-size:13px;color:var(--muted);text-align:right}
.mix{display:flex;height:36px;border-radius:10px;overflow:hidden;gap:2px;background:var(--card)}
.mix i{display:block;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .ln{width:16px;height:0;border-top:2px solid;flex:none}
.legend .ln.dash{border-top-style:dashed}
.cgrp{font-size:13px;color:var(--muted);margin:14px 0 4px;display:flex;justify-content:space-between}
.cgrp:first-of-type{margin-top:4px}
.bar{display:block;width:100%;text-align:left;padding:7px 2px;border-radius:10px}
.bar:active{background:var(--brand-soft)}
.bar .top{display:flex;gap:8px;align-items:baseline;font-size:15px}
.bar .top .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .top .v{font-weight:700;white-space:nowrap}
.bar .top .p{font-size:12px;color:var(--muted);width:34px;text-align:right}
.bar .track{height:6px;margin-top:4px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bar.sub{padding-left:28px}
.bar.sub .top{font-size:14px}
.bar.sub .track{height:4px;opacity:.6}
.bar .chev{color:var(--muted);font-size:13px;width:14px;display:inline-block}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;font-size:11px;fill:var(--muted)}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap}
.tip .h{color:var(--muted);font-size:12px;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:6px}
.tip .r i{width:12px;height:0;border-top:2px solid;display:inline-block}
.tip .r b{margin-left:auto;padding-left:10px}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
details.tbl{margin-top:8px;font-size:13px}
details.tbl summary{color:var(--muted);cursor:pointer;padding:4px 0}
details.tbl table{width:100%;border-collapse:collapse;margin-top:4px}
details.tbl td,details.tbl th{padding:5px 3px;border-bottom:1px solid var(--line);text-align:right;font-weight:400;white-space:nowrap}
details.tbl td:first-child,details.tbl th:first-child{text-align:left}
details.tbl th{color:var(--muted)}
.dim{opacity:.55;transition:opacity .2s}
/* เฟส 3: แก้แม่แบบในหน้าชุดวันเงินเดือน */
.slip td.more{width:34px;text-align:right}
.slip .morebtn{width:32px;height:36px;border-radius:10px;color:var(--muted);font-size:18px}
.slip tr.gone td{opacity:.55}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;margin-top:4px;background:var(--card)}
.tag.on{border-color:var(--brand);background:var(--brand-soft)}
.addrow{display:block;width:100%;text-align:left;color:var(--brand);font-weight:600;padding:8px 2px;font-size:15px}
.lnk{color:var(--brand);text-decoration:underline;font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-weight:600}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}

/* ---------- เฟส 4: งบดุล / สุขภาพการเงิน ---------- */
:root{ --good:#1f8a5b; --mid:#b26a00; --low:#c0392b; }
@media (prefers-color-scheme: dark){ :root{ --good:#5fd39c; --mid:#f0b35a; --low:#ff8a7a; } }
.good{color:var(--good)} .mid{color:var(--mid)} .low{color:var(--low)}
.hcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.hcard .chev{font-size:22px;color:var(--muted)}
.hs{flex:none;min-width:64px;text-align:center}
.hscore{font-size:30px;font-weight:700;line-height:1}
.hscore.big{font-size:44px}
.hs small{color:var(--muted);font-size:13px}
.hlab{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;border:1px solid currentColor}
.hlab.good{color:var(--good)} .hlab.mid{color:var(--mid)} .hlab.low{color:var(--low)}
.hmini{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;font-size:12.5px;color:var(--ink2)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:2px 0 6px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--muted)}
.meter i.good{background:var(--good)} .meter i.mid{background:var(--mid)} .meter i.low{background:var(--low)}
.hm{border-top:1px solid var(--line);padding:9px 0 8px}
.hm:first-of-type{border-top:0}
.nw{font-size:30px;font-weight:700;margin:2px 0}
.bsrow,.bsh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 2px;border-top:1px solid var(--line)}
.bsrow .nm{display:block;font-weight:600}
.bsrow small,.bsh small{display:block;color:var(--muted);font-size:12.5px}
.bsrow b,.bsh b{white-space:nowrap}
.bsh.ro{cursor:default}
.bsin{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;margin:2px -8px}
.bsin label{flex:1;min-width:0}
.bsin .nm{display:block;font-weight:600}
.bsin small{display:block;color:var(--muted);font-size:12px}
.bsin .field{width:42%;flex:none;text-align:right;font-weight:700;padding:10px}
.bsin.chg{background:var(--brand-soft)}
.bsin.bad .field{border-color:var(--exp)}
.ghost.exp{color:var(--exp)}
.stickybar{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));margin:12px -16px calc(-18px - env(safe-area-inset-bottom));padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.stickybar .primary{margin-top:8px}
</style>
</head>
<body>
<header>
  <h1 id="title">เพิ่มรายการ</h1>
  <div class="hdr"><button class="syncbtn" id="btnSync" hidden></button><button class="iconbtn" id="btnSet" aria-label="ตั้งค่า">⚙️</button></div>
</header>

<main>
  <div id="loading" class="skeleton">กำลังโหลดข้อมูลจากชีต…</div>

  <!-- หน้าเพิ่มรายการ -->
  <section id="v-add" hidden>
    <div class="note-bar" id="bootBar" hidden></div>
    <div class="card" id="addForm"></div>
    <button class="ghost" id="btnPayday" style="width:100%;margin-bottom:12px">💰 ชุดรายการวันเงินเดือน</button>
    <div class="card">
      <div class="row between"><b id="dayTitle">วันนี้</b><span id="daySum" class="muted"></span></div>
      <div id="dayList"></div>
    </div>
  </section>

  <!-- หน้ารายการ -->
  <section id="v-list" hidden>
    <div class="chips" id="modeChips"></div>
    <div class="card">
      <div class="nav"><button id="prev" aria-label="ก่อนหน้า">‹</button><div class="lbl" id="periodLbl"></div><button id="next" aria-label="ถัดไป">›</button></div>
      <div id="customBox" class="row" style="margin-top:10px" hidden>
        <input type="date" class="field" id="cStart"><span>ถึง</span><input type="date" class="field" id="cEnd">
      </div>
      <div class="row" style="margin-top:10px;justify-content:center"><button class="ghost" id="btnToday">วันนี้</button></div>
    </div>
    <div class="card"><div class="sum" id="sumBox"></div><div class="split" id="splitBox"></div></div>
    <div id="txList"></div>
  </section>

  <!-- หน้าภาพรวม (เฟส 3) -->
  <section id="v-over" hidden>
    <div class="ovtop">
      <div class="seg" id="ovMode"><button data-m="cycle">รอบเงินเดือน</button><button data-m="month">เดือนปฏิทิน</button></div>
      <div class="card" style="margin:0">
        <div class="nav"><button id="ovPrev" aria-label="ช่วงก่อนหน้า">‹</button><div class="lbl" id="ovLbl"></div><button id="ovNext" aria-label="ช่วงถัดไป">›</button></div>
        <div class="note" id="ovSub" style="text-align:center;margin-top:6px"></div>
      </div>
    </div>
    <div id="ovBody"></div>
  </section>

  <!-- หน้างบดุล (เฟส 4) -->
  <section id="v-bal" hidden>
    <div id="balBody"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="add" class="on"><b>➕</b>เพิ่ม</button>
  <button data-tab="list"><b>📋</b>รายการ</button>
  <button data-tab="over"><b>📊</b>ภาพรวม</button>
  <button data-tab="bal"><b>⚖️</b>งบดุล</button>
</nav>

<script id="pure">
/* ---------- ฟังก์ชันล้วน (ไม่แตะหน้าจอ) ใช้ทดสอบแยกได้ ---------- */
var TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var TH_DAYS = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
var MEAL_LIST = [['เช้า','☀️'],['กลางวัน','🌞'],['เย็น','🌙']];

/** "120+45-10" -> {ok:true, value:155}; คิดเป็นสตางค์ทั้งหมดเพื่อไม่ให้ทศนิยมเพี้ยน */
function parseAmount(raw){
  var s = String(raw == null ? '' : raw).replace(/[,\s฿]/g,'').replace(/[−–—]/g,'-').replace(/＋/g,'+');
  if (!s) return {ok:false, empty:true, error:''};
  if (!/^[+-]?\d*\.?\d*([+-]\d*\.?\d*)*$/.test(s)) return {ok:false, error:'ใช้ได้เฉพาะตัวเลข จุดทศนิยม + และ -'};
  var terms = s.match(/[+-]?[^+-]+/g);
  if (!terms || /[+-]$/.test(s)) return {ok:false, error:'พิมพ์ตัวเลขต่อท้ายเครื่องหมายให้ครบ'};
  var cents = 0;
  for (var i=0;i<terms.length;i++){
    var m = /^([+-]?)(\d*)(?:\.(\d*))?$/.exec(terms[i]);
    if (!m || (m[2]==='' && (m[3]===undefined || m[3]===''))) return {ok:false, error:'ตัวเลขไม่ครบ'};
    var frac = m[3] || '';
    if (frac.length > 2) return {ok:false, error:'ทศนิยมได้ไม่เกิน 2 ตำแหน่ง'};
    var c = Number(m[2] || '0') * 100 + Number((frac + '00').slice(0,2));
    cents += (m[1] === '-' ? -c : c);
  }
  if (cents <= 0) return {ok:false, error:'ผลรวมต้องมากกว่า 0'};
  if (cents > 1000000000) return {ok:false, error:'จำนวนเงินสูงผิดปกติ'};
  return {ok:true, value:cents/100, cents:cents, isExpr: terms.length > 1};
}

function fmtMoney(n){
  var cents = Math.round(Math.abs(n)*100);
  var whole = Math.floor(cents/100), frac = cents % 100;
  var s = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  if (frac) s += '.' + (frac < 10 ? '0' : '') + frac;
  return (n < 0 && cents ? '-' : '') + s;
}

function pad2(n){ return (n<10?'0':'') + n; }
function isoParts(iso){ var p = iso.split('-'); return [Number(p[0]), Number(p[1]), Number(p[2])]; }
function isoFromUTC(t){ var d = new Date(t); return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()); }
function utcOf(iso){ var p = isoParts(iso); return Date.UTC(p[0], p[1]-1, p[2]); }
function addDays(iso, n){ return isoFromUTC(utcOf(iso) + n*86400000); }
function weekday(iso){ return new Date(utcOf(iso)).getUTCDay(); }
function thaiDate(iso, withDay){
  if (!iso) return '';
  var p = isoParts(iso);
  return (withDay ? TH_DAYS[weekday(iso)] + ' ' : '') + p[2] + ' ' + TH_MONTHS[p[1]-1] + ' ' + (p[0] + 543);
}
function monthStart(iso){ return iso.slice(0,8) + '01'; }
function monthEnd(iso){ var p = isoParts(iso); return isoFromUTC(Date.UTC(p[0], p[1], 0)); }
function addMonths(iso, n){ var p = isoParts(iso); return isoFromUTC(Date.UTC(p[0], p[1]-1+n, 1)); }

/** หารอบเงินเดือนที่ครอบวันที่ iso; รอบที่ยังไม่ปิดใช้วันนี้เป็นวันสุดท้าย */
function cycleFor(iso, cycles, today){
  for (var i = cycles.length-1; i >= 0; i--){
    var c = cycles[i];
    if (c.start <= iso && (!c.end || iso <= c.end)) {
      return {start:c.start, end:c.end || (today > c.start ? today : c.start), open:!c.end, index:i};
    }
  }
  return null;
}

/** ช่วงวันที่ของแต่ละโหมด */
function periodRange(mode, anchor, cycles, today, custom){
  if (mode === 'day') return {start:anchor, end:anchor, label:thaiDate(anchor, true)};
  if (mode === 'month'){ var p = isoParts(anchor); return {start:monthStart(anchor), end:monthEnd(anchor), label:TH_MONTHS[p[1]-1] + ' ' + (p[0]+543)}; }
  if (mode === 'year'){ var y = isoParts(anchor)[0]; return {start:y+'-01-01', end:y+'-12-31', label:'ปี ' + (y+543)}; }
  if (mode === 'cycle'){
    var c = cycleFor(anchor, cycles, today);
    if (!c) return {start:monthStart(anchor), end:monthEnd(anchor), label:'ไม่มีรอบเงินเดือน (แสดงทั้งเดือน)', noCycle:true};
    return {start:c.start, end:c.end, open:c.open, label:'รอบ ' + thaiDate(c.start) + ' – ' + (c.open ? 'ปัจจุบัน' : thaiDate(c.end))};
  }
  var s = custom.start, e = custom.end;
  if (e < s){ var t = s; s = e; e = t; }
  return {start:s, end:e, label:thaiDate(s) + ' – ' + thaiDate(e)};
}

/** เลื่อนช่วงไปก่อนหน้า (-1) / ถัดไป (+1) */
function shiftAnchor(mode, anchor, dir, cycles, today){
  if (mode === 'day') return addDays(anchor, dir);
  if (mode === 'month') return addMonths(anchor, dir);
  if (mode === 'year'){ var y = isoParts(anchor)[0] + dir; return y + anchor.slice(4); }
  if (mode === 'cycle'){
    var c = cycleFor(anchor, cycles, today);
    if (!c) return addMonths(anchor, dir);
    if (dir < 0) return addDays(c.start, -1);
    return c.open ? anchor : addDays(c.end, 1);
  }
  return anchor;
}

/** รวมยอด และแยก 3 ทาง (ใช้จ่ายจริง / ออมและลงทุน / ผ่อนหนี้) */
function totals(list, catMap){
  var t = {inc:0, exp:0, spend:0, save:0, debt:0, share:0};
  list.forEach(function(x){
    var c = Math.round(x.amount*100);
    if (x.type === 'รายได้') {
      t.inc += c;
      var ci = catMap[x.catId];
      if (ci && ci.sum3 === 'เงินหารค่าบริการ') t.share += c;
    } else {
      t.exp += c;
      var k = (catMap[x.catId] || {}).sum3;
      if (k === 'ออมและลงทุน') t.save += c; else if (k === 'ผ่อนหนี้') t.debt += c; else t.spend += c;
    }
  });
  Object.keys(t).forEach(function(k){ t[k] = t[k]/100; });
  return t;
}

function groupByDay(list){
  var out = [], cur = null;
  list.forEach(function(x){
    if (!cur || cur.date !== x.date){ cur = {date:x.date, items:[], inc:0, exp:0}; out.push(cur); }
    cur.items.push(x);
    if (x.type === 'รายได้') cur.inc = (Math.round(cur.inc*100) + Math.round(x.amount*100))/100;
    else cur.exp = (Math.round(cur.exp*100) + Math.round(x.amount*100))/100;
  });
  return out;
}

function catLabel(c){ return !c ? 'ไม่พบหมวด' : (c.sub === c.main ? c.main : c.sub); }
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
function newToken(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,10); }

/* ---------- ตัวช่วยของหน้าตั้งค่าเครื่อง / ล็อก ---------- */
var API_URL_RE = /https:\/\/script\.google\.com\/(?:a\/[^\/\s]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec/;
/** แยกลิงก์และกุญแจจากสิ่งที่วาง (วางรวมกันช่องเดียวก็ได้) */
function parseSetup(urlText, keyText){
  var all = String(urlText || '') + ' ' + String(keyText || '');
  var u = API_URL_RE.exec(all);
  var rest = u ? all.replace(u[0], ' ') : all;
  var k = /(?:^|[^0-9a-zA-Z])([0-9a-fA-F]{64})(?![0-9a-zA-Z])/.exec(rest);
  return { url: u ? u[0] : '', key: k ? k[1].toLowerCase() : '' };
}
function pinProblem(pin){
  if (!/^\d{6}$/.test(pin)) return 'PIN ต้องเป็นตัวเลข 6 หลัก';
  if (/^(\d)\1{5}$/.test(pin)) return 'PIN ห้ามเป็นเลขเดียวกันทั้งหมด';
  if ('01234567890'.indexOf(pin) >= 0 || '09876543210'.indexOf(pin) >= 0) return 'PIN ห้ามเป็นเลขเรียงกัน';
  return '';
}
var MAX_PIN_FAILS = 10;
/** ใส่ PIN ผิดครบ 5 ครั้งต้องรอ 30 วินาที แล้วเพิ่มเป็นเท่าตัว (สูงสุด 8 นาที) ผิดครบ 10 ครั้งล้างกุญแจออกจากเครื่อง */
function lockoutMs(fails){ return fails < 5 ? 0 : 30000 * Math.pow(2, Math.min(fails - 5, 4)); }
function b64u(buf){
  var b = new Uint8Array(buf), s = '';
  for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64u(str){
  var s = String(str).replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function shortUrl(u){ var m = /\/s\/([A-Za-z0-9_-]+)\/exec/.exec(u || ''); return m ? '…/s/' + m[1].slice(0,6) + '…' + m[1].slice(-4) + '/exec' : ''; }

/* ---------- ที่จำรายการในหน่วยความจำ (ปิดแอปแล้วหาย ไม่เขียนลงเครื่อง) ----------
   tx: รายการที่ยืนยันจากชีตแล้ว, cov: ช่วงวันที่ที่รู้ครบแล้ว [{s,e,at}],
   touched/gone: เวลาที่แอปเพิ่ม/แก้/ลบเอง ใช้กันข้อมูลเก่าที่ขอไว้ก่อนหน้ามาทับของใหม่ */
function newStore(){ return { tx:{}, cov:[], touched:{}, gone:{} }; }
/** คืนเวลาที่ข้อมูลช่วง s..e ใหม่ที่สุด (0 = ยังไม่รู้ครบ ต้องขอจากชีต) */
function storeCovered(st, s, e){
  var best = 0;
  st.cov.forEach(function(c){ if (c.s <= s && e <= c.e && c.at > best) best = c.at; });
  return best;
}
function storeAddCov(st, s, e, at){
  // ช่วงเก่าที่อยู่ข้างในช่วงใหม่และเก่ากว่า ไม่ต้องจำแล้ว
  st.cov = st.cov.filter(function(c){ return !(s <= c.s && c.e <= e && c.at <= at); });
  st.cov.push({s:s, e:e, at:at});
  if (st.cov.length > 40) st.cov.shift();
}
/** ผลจากชีตของช่วง s..e ที่ขอไว้ตอนเวลา startedAt: แทนที่ของเดิมในช่วงนั้น ยกเว้นสิ่งที่แอปเพิ่ง เพิ่ม/แก้/ลบ หลังจากเริ่มขอ */
function storeMerge(st, s, e, items, startedAt){
  var seen = {};
  items.forEach(function(x){ seen[x.id] = 1; });
  Object.keys(st.tx).forEach(function(id){
    var x = st.tx[id];
    if (x.date >= s && x.date <= e && !seen[id] && !((st.touched[id] || 0) > startedAt)) delete st.tx[id];
  });
  items.forEach(function(x){
    if ((st.gone[x.id] || 0) > startedAt) return;
    if ((st.touched[x.id] || 0) > startedAt) return;
    st.tx[x.id] = x;
  });
  storeAddCov(st, s, e, startedAt);
}
function storePut(st, x, now){ st.tx[x.id] = x; st.touched[x.id] = now; delete st.gone[x.id]; }
function storeDel(st, id, now){ delete st.tx[id]; st.gone[id] = now; }
function idNum(id){ var m = /^T(\d+)$/.exec(id || ''); return m ? Number(m[1]) : 0; }
/** เรียงแบบเดียวกับชีต: วันใหม่ก่อน วันเดียวกันรายการที่ยังไม่ได้ส่งขึ้นก่อน แล้วรายการที่บันทึกทีหลังขึ้นก่อน */
function viewSort(list){
  return list.sort(function(a,b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    if (!!a.pending !== !!b.pending) return a.pending ? -1 : 1;
    if (a.pending) return (b.at - a.at) || (b.idx - a.idx);
    return idNum(b.id) - idNum(a.id);
  });
}
function storeQuery(st, s, e){
  var out = [];
  Object.keys(st.tx).forEach(function(id){ var x = st.tx[id]; if (x.date >= s && x.date <= e) out.push(x); });
  return out;
}
/** รายการที่ยังไม่ได้ส่ง (จากคิวในเครื่อง) ในรูปแบบเดียวกับรายการจริง */
function outboxItems(box, s, e){
  var out = [];
  box.forEach(function(en){
    en.items.forEach(function(it, i){
      if (it.date < s || it.date > e) return;
      out.push({ id:'P-' + en.token + '-' + i, pending:true, token:en.token, idx:i, at:en.at, state:en.state, err:en.err || '',
        date:it.date, type:it.type, catId:it.catId, amount:it.amount, note:it.note, meals:it.meals || [], source:en.source });
    });
  });
  return out;
}
/** ผลบันทึกจากเซิร์ฟเวอร์ -> รายการจริง (เซิร์ฟเวอร์ 2.1 ส่งมาแค่รหัส จึงประกอบจากที่ส่งไป) */
function savedItems(res, entry){
  if (res && res.items && res.items.length === entry.items.length) return res.items;
  return entry.items.map(function(it, i){
    return { id:res.ids[i], date:it.date, type:it.type, catId:it.catId, amount:it.amount, note:it.note || '', meals:it.meals || [], source:entry.source };
  });
}
/** ส่งไม่สำเร็จเพราะเน็ต (ลองใหม่เองได้) หรือเพราะข้อมูล (ต้องให้เบ๊บแก้) */
function retryable(err){ return !err || !err.code || err.code === 'BAD_REQUEST'; }
function nextDelay(prev){ return Math.min(Math.max(2000, (prev || 0) * 2), 60000); }
function localIso(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }

/* ---------- เฟส 3: คำนวณหน้าภาพรวม (ฟังก์ชันล้วน) ---------- */
/** รายการ -> ยอดรวมรายหมวดเป็นสตางค์ รูปแบบเดียวกับที่เซิร์ฟเวอร์ส่งมา { '+IN005': 3473000, '-EX087': 7600 } */
function aggregate(list){
  var out = {};
  list.forEach(function(x){
    var k = (x.type === 'รายได้' ? '+' : '-') + x.catId;
    out[k] = (out[k] || 0) + Math.round(x.amount * 100);
  });
  return out;
}
function aggMerge(a, b){
  var out = {};
  [a, b].forEach(function(m){ Object.keys(m || {}).forEach(function(k){ out[k] = (out[k] || 0) + m[k]; }); });
  return out;
}
/** ยอดหลักของช่วง (บาท): รายได้จริง ไม่นับเงินที่เพื่อนหารค่าบริการและเงินยืม; รายจ่ายแยก 3 ทาง */
function figures(agg, catMap){
  var f = { inc:0, realInc:0, share:0, loan:0, exp:0, spend:0, save:0, debt:0 };
  Object.keys(agg || {}).forEach(function(k){
    var v = agg[k], c = catMap[k.slice(1)], s = c ? c.sum3 : '';
    if (k.charAt(0) === '+'){
      f.inc += v;
      if (s === 'เงินหารค่าบริการ') f.share += v; else if (s === 'เงินยืม (ต้องคืน)') f.loan += v; else f.realInc += v;
    } else {
      f.exp += v;
      if (s === 'ออมและลงทุน') f.save += v; else if (s === 'ผ่อนหนี้') f.debt += v; else f.spend += v;
    }
  });
  Object.keys(f).forEach(function(k){ f[k] = f[k] / 100; });
  f.net = (Math.round(f.inc * 100) - Math.round(f.exp * 100)) / 100;
  f.spendNet = (Math.round(f.spend * 100) - Math.round(f.share * 100)) / 100;
  return f;
}
var SUM3_ORDER = ['ใช้จ่ายจริง', 'ออมและลงทุน', 'ผ่อนหนี้'];
function sum3Of(c){ var s = c && c.sum3; return s === 'ออมและลงทุน' || s === 'ผ่อนหนี้' ? s : 'ใช้จ่ายจริง'; }
/** รายจ่ายแยกตามกลุ่มสรุป -> หมวดหลัก -> หมวดย่อย เรียงจากมากไปน้อย (สตางค์) */
function expenseTree(agg, catMap){
  var groups = {}, out = [];
  SUM3_ORDER.forEach(function(g){ groups[g] = { name:g, cents:0, mains:[], idx:{} }; out.push(groups[g]); });
  Object.keys(agg || {}).forEach(function(k){
    if (k.charAt(0) !== '-' || !agg[k]) return;
    var id = k.slice(1), c = catMap[id];
    var g = groups[sum3Of(c)];
    var mk = c ? c.group + '|' + c.main : '?|' + id;
    var m = g.idx[mk];
    if (!m){ m = g.idx[mk] = { key:mk, main:c ? c.main : id, icon:c ? c.icon : '❔', cents:0, subs:[] }; g.mains.push(m); }
    m.cents += agg[k]; g.cents += agg[k];
    m.subs.push({ catId:id, name:c ? (c.sub === c.main ? c.main : c.sub) : id, cents:agg[k] });
  });
  out.forEach(function(g){
    delete g.idx;
    g.mains.sort(function(a, b){ return b.cents - a.cents || (a.main < b.main ? -1 : 1); });
    g.mains.forEach(function(m){ m.subs.sort(function(a, b){ return b.cents - a.cents; }); });
  });
  return out;
}
function daysIn(s, e){ return Math.round((utcOf(e) - utcOf(s)) / 86400000) + 1; }
/** ยอดสะสมรายวันของรายการที่ pick(x) เป็นจริง ตั้งแต่วันแรกของช่วงถึงวัน upto (บาท) */
function cumulative(list, start, upto, pick){
  var n = Math.max(0, daysIn(start, upto)), daily = [], i;
  for (i = 0; i < n; i++) daily.push(0);
  list.forEach(function(x){
    if (x.date < start || x.date > upto || !pick(x)) return;
    daily[daysIn(start, x.date) - 1] += Math.round(x.amount * 100);
  });
  var run = 0, out = [];
  for (i = 0; i < n; i++){ run += daily[i]; out.push(run / 100); }
  return out;
}
/** ช่วงย้อนหลัง n ช่วงที่จบที่ช่วงของ anchor เรียงเก่าไปใหม่ (หยุดเมื่อไม่มีรอบเงินเดือนก่อนหน้า) */
function trendPeriods(mode, anchor, cycles, today, n){
  var out = [], a = anchor, seen = {};
  for (var i = 0; i < n; i++){
    var r = periodRange(mode, a, cycles, today, null);
    if (r.noCycle || seen[r.start]) break;
    seen[r.start] = 1;
    out.unshift(r);
    a = shiftAnchor(mode, a, -1, cycles, today);
  }
  return out;
}
/** ป้ายสั้นใต้แท่งกราฟ: เดือนปฏิทิน = เดือน, รอบเงินเดือน = วันเริ่มรอบ */
function shortLabel(mode, r){
  var p = isoParts(r.start);
  return mode === 'month' ? TH_MONTHS[p[1]-1] : p[2] + ' ' + TH_MONTHS[p[1]-1];
}
/** "ค่าที่เปลี่ยน" เทียบช่วงก่อนหน้า -> {dir: 1/-1/0, diff, pct} */
function delta(cur, prev){
  if (prev == null) return null;
  var d = (Math.round(cur * 100) - Math.round(prev * 100)) / 100;

/** ทำให้ตัวเลขแกนเป็นเลขกลม ๆ: คืน [0, step, 2step, ...] ครอบค่าสูงสุด */
function niceTicks(max, count){
  if (!(max > 0)) return [0, 1];

  var step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag, out = [];
  for (var v = 0; v < max + step * 0.001; v += step) out.push(Math.round(v * 100) / 100);

/* ---------- เฟส 3: แม่แบบวันเงินเดือน ---------- */
/** แถวที่จะจำเป็นแม่แบบ จากแถวบนหน้าจอ (ติ๊กออก = เดือนนี้ไม่มี แต่ยังอยู่ในแม่แบบด้วยจำนวนเดิม) */
function templateFromRows(rows){

function sameTemplate(a, b){

  for (var i = 0; i < a.length; i++){
    var x = a[i], y = b[i];

function templateLocal(rows, catMap){
  return rows.map(function(r){
    var c = catMap[r.catId] || {}, d = r.detail || '', type = c.type || 'รายจ่าย';
    if (type === 'รายจ่าย'){
      var has = d.indexOf('หักจากสลิป') === 0;
      if (r.slip && !has) d = d ? 'หักจากสลิป · ' + d : 'หักจากสลิป';
      if (!r.slip && has) d = d.replace(/^หักจากสลิป\s*[·:\-]?\s*/, '');

/* ---------- เฟส 4: งบดุลและคะแนนสุขภาพการเงิน (ฟังก์ชันล้วน) ---------- */
var BS_GROUPS = ['สินทรัพย์สภาพคล่อง', 'สินทรัพย์ลงทุน', 'สินทรัพย์ส่วนตัว', 'หนี้สินระยะสั้น', 'หนี้สินระยะยาว'];
/** ยอดล่าสุดของแต่ละรายการ ณ วันที่ iso (แถวเรียงตามวันที่แล้ว แถวหลังใหม่กว่า) -> { BS01: แถว } */
function bsAsOf(bal, iso){
  var last = {};
  bal.rows.forEach(function(r){ if (r.date <= iso) last[r.item] = r; });
  return last;
}
/** ยอดรวมงบดุล ณ วันที่ iso (บาท) และวันที่ล่าสุดของข้อมูลที่ใช้ */
function bsTotals(bal, iso){
  var last = bsAsOf(bal, iso), c = { asset:0, liab:0, liquid:0, invest:0, personal:0 }, groups = {}, date = '', n = 0;
  bal.items.forEach(function(it){
    var r = last[it.id]; if (!r) return;
    var v = Math.round(r.amount * 100);
    n++;
    if (r.date > date) date = r.date;
    groups[it.group] = (groups[it.group] || 0) + v;
    if (it.side === 'หนี้สิน') c.liab += v; else c.asset += v;
    if (it.group === 'สินทรัพย์สภาพคล่อง') c.liquid += v;
    else if (it.group === 'สินทรัพย์ลงทุน') c.invest += v;
    else if (it.group === 'สินทรัพย์ส่วนตัว') c.personal += v;
  });
  var out = { date:date, n:n, groups:{}, last:last };
  Object.keys(c).forEach(function(k){ out[k] = c[k] / 100; });
  Object.keys(groups).forEach(function(k){ out.groups[k] = groups[k] / 100; });
  out.net = (c.asset - c.liab) / 100;
  return out;
}
/** ความมั่งคั่งสุทธิ ณ สิ้นเดือน ย้อนหลัง n เดือน (เดือนปัจจุบันใช้ยอด ณ วันนี้) ข้ามเดือนที่ยังไม่มีข้อมูล */
function bsMonthly(bal, today, n){
  var out = [], m = monthStart(today);
  for (var i = n - 1; i >= 0; i--){
    var ms = addMonths(m, -i), me = monthEnd(ms), at = me > today ? today : me, t = bsTotals(bal, at);
    if (!t.n) continue;
    var p = isoParts(ms);
    out.push({ iso:at, label:TH_MONTHS[p[1]-1], full:TH_MONTHS[p[1]-1] + ' ' + (p[0] + 543), net:t.net, asset:t.asset, liab:t.liab, open:me > today });
  }
  return out;
}
/** รายได้แยกที่มา: งานประจำ / ผลตอบแทนจากสินทรัพย์ (ดอกเบี้ย ปันผล ค่าเช่า ไม่นับขายสินทรัพย์) */
function flowFigures(agg, catMap){
  var f = figures(agg, catMap), work = 0, passive = 0;
  Object.keys(agg || {}).forEach(function(k){
    if (k.charAt(0) !== '+') return;
    var c = catMap[k.slice(1)]; if (!c) return;
    if (c.group === 'รายได้จากการทำงาน') work += agg[k];
    else if (c.group === 'รายได้จากสินทรัพย์' && c.main !== 'ค่าขายสินทรัพย์') passive += agg[k];
  });
  f.work = work / 100; f.passive = passive / 100;
  return f;
}
/** เฉลี่ยยอดของหลายช่วง (ช่วงที่ครบแล้ว) */
function avgFlows(list){
  var keys = ['inc','realInc','share','loan','exp','spend','save','debt','spendNet','work','passive'], out = { n:list.length };
  keys.forEach(function(k){
    var s = 0; list.forEach(function(f){ s += Math.round((f[k] || 0) * 100); });
    out[k] = list.length ? Math.round(s / list.length) / 100 : 0;
  });
  return out;
}
function clamp10(x){ return Math.max(0, Math.min(10, x)); }
function lin(x, bad, good){ return clamp10((x - bad) / (good - bad) * 10); }
function pctTxt(x){ return (Math.round(x * 1000) / 10).toFixed(1).replace(/\.0$/, '') + '%'; }
function xTxt(x){ return (Math.round(x * 100) / 100).toFixed(2) + ' เท่า'; }
function healthLabel(s){ return s == null ? '' : s >= 7 ? 'ดี' : s >= 4 ? 'พอใช้' : 'ควรปรับ'; }
/**
 * คะแนนสุขภาพการเงิน 0–10: 4 กลุ่ม (เงินสำรอง / กระแสเงินสด / หนี้ / การออมและลงทุน) เฉลี่ยเท่ากัน
 * แต่ละกลุ่ม = เฉลี่ยคะแนนตัวชี้วัดในกลุ่ม ตัวชี้วัดที่คำนวณไม่ได้ (ตัวหารเป็นศูนย์) ไม่นับ และแสดงเหตุผลแทน
 * bs = bsTotals(...), fl = avgFlows(...) ค่าใช้จ่ายจำเป็น = ใช้จ่ายจริง (หักเงินที่เพื่อนหาร) + ผ่อนหนี้ ไม่นับเงินออม
 */
function healthScore(bs, fl, word){
  word = word || 'รอบ';
  var need = Math.round((fl.spendNet + fl.debt) * 100) / 100, inc = fl.realInc, M = {};
  function m(key, name, o){ o.key = key; o.name = name; M[key] = o; return o; }
  // 1) เงินสำรอง
  if (need > 0){
    var lq = bs.liquid / need;
    m('liq', 'สภาพคล่อง', { value:xTxt(lq), raw:lq, score:lin(lq, 0, 3), target:'3–6 เท่าของค่าใช้จ่ายจำเป็นต่อ' + word,
      text:'เงินสด/เงินฝาก ' + fmtMoney(bs.liquid) + ' พอใช้ราว ' + Math.round(lq * 30) + ' วัน' });
  } else m('liq', 'สภาพคล่อง', { value:'–', score:null, target:'3–6 เท่า', text:'ยังไม่มีค่าใช้จ่ายในช่วงที่ใช้คำนวณ' });
  // 2) กระแสเงินสด
  if (inc > 0){
    var left = Math.round((inc - need - fl.save) * 100) / 100, rate = left / inc;
    m('cash', 'เงินเหลือหลังใช้จ่าย ผ่อน และออม', { value:fmtMoney(left) + ' (' + pctTxt(rate) + ')', raw:rate, score:clamp10(5 + rate * 50), target:'เป็นบวก ดีที่สุดเหลือ 10% ของรายได้ขึ้นไป',
      text:(left >= 0 ? 'เหลือเฉลี่ย ' : 'ขาดเฉลี่ย ') + fmtMoney(Math.abs(left)) + ' ต่อ' + word });
  } else m('cash', 'เงินเหลือหลังใช้จ่าย ผ่อน และออม', { value:'–', score:null, target:'เป็นบวก', text:'ยังไม่มีรายได้ในช่วงที่ใช้คำนวณ' });
  if (need > 0){
    var sv = (fl.work + fl.passive) / need;
    m('surv', 'ความอยู่รอด', { value:xTxt(sv), raw:sv, score:lin(sv, 0.5, 1), target:'1 เท่าขึ้นไป',
      text:'รายได้ประจำ (งาน + ผลตอบแทนสินทรัพย์) ครอบคลุมค่าใช้จ่ายจำเป็น ' + Math.round(sv * 100) + '%' });
  } else m('surv', 'ความอยู่รอด', { value:'–', score:null, target:'1 เท่าขึ้นไป', text:'ยังไม่มีค่าใช้จ่ายในช่วงที่ใช้คำนวณ' });
  // 3) หนี้
  if (inc > 0){
    var dsr = fl.debt / inc;
    m('dsr', 'ผ่อนหนี้ต่อรายได้', { value:pctTxt(dsr), raw:dsr, score:lin(dsr, 0.6, 0.35), target:'ไม่เกิน 35%',
      text:'รายได้ทุก 100 บาท ไปผ่อนหนี้ ' + Math.round(dsr * 100) + ' บาท' });
  } else m('dsr', 'ผ่อนหนี้ต่อรายได้', { value:'–', score:null, target:'ไม่เกิน 35%', text:'ยังไม่มีรายได้ในช่วงที่ใช้คำนวณ' });
  if (bs.n){
    var dar = bs.asset > 0 ? bs.liab / bs.asset : null;
    m('dar', 'หนี้สินต่อสินทรัพย์', dar == null ? { value:'–', score:bs.liab > 0 ? 0 : 10, target:'ไม่เกิน 50%', text:'ยังไม่มีสินทรัพย์ในงบดุล' } :
      { value:pctTxt(dar), raw:dar, score:lin(dar, 2, 0.5), target:'ไม่เกิน 50%',
        text:'หนี้ ' + fmtMoney(bs.liab) + ' เทียบสินทรัพย์ ' + fmtMoney(bs.asset) + ' · ความมั่งคั่งสุทธิ ' + fmtMoney(bs.net) });
  } else m('dar', 'หนี้สินต่อสินทรัพย์', { value:'–', score:null, target:'ไม่เกิน 50%', text:'ยังไม่มีข้อมูลงบดุล' });
  // 4) การออมและลงทุน
  if (inc > 0){
    var srate = fl.save / inc;
    m('save', 'อัตราการออม', { value:pctTxt(srate), raw:srate, score:lin(srate, 0, 0.1), target:'10% ของรายได้ขึ้นไป',
      text:'ออมและลงทุนเฉลี่ย ' + fmtMoney(fl.save) + ' ต่อ' + word });
  } else m('save', 'อัตราการออม', { value:'–', score:null, target:'10% ขึ้นไป', text:'ยังไม่มีรายได้ในช่วงที่ใช้คำนวณ' });
  if (bs.asset > 0){
    var ir = bs.invest / bs.asset;
    m('inv', 'สัดส่วนสินทรัพย์ลงทุน', { value:pctTxt(ir), raw:ir, score:lin(ir, 0, 0.5), target:'50% ของสินทรัพย์ขึ้นไป',
      text:'สินทรัพย์ลงทุน ' + fmtMoney(bs.invest) + ' จากสินทรัพย์ทั้งหมด ' + fmtMoney(bs.asset) });
  } else m('inv', 'สัดส่วนสินทรัพย์ลงทุน', { value:'–', score:null, target:'50% ขึ้นไป', text:'ยังไม่มีสินทรัพย์ในงบดุล' });
  var wr = need > 0 ? fl.passive / need : null;
  m('wealth', 'ความมั่งคั่ง (ผลตอบแทนจากสินทรัพย์)', { value:wr == null ? '–' : xTxt(wr), raw:wr, score:null, info:true, target:'เป้าระยะยาว 1 เท่า · ไม่นับในคะแนน',
    text:wr == null ? 'ยังไม่มีค่าใช้จ่ายในช่วงที่ใช้คำนวณ' : 'ดอกเบี้ย ปันผล ค่าเช่า เฉลี่ย ' + fmtMoney(fl.passive) + ' ครอบคลุมค่าใช้จ่ายจำเป็น ' + Math.round(wr * 100) + '%' });
  var groups = [
    { name:'เงินสำรอง', keys:['liq'] },
    { name:'กระแสเงินสด', keys:['cash','surv'] },
    { name:'หนี้', keys:['dsr','dar'] },
    { name:'การออมและลงทุน', keys:['save','inv','wealth'] }
  ];
  var tot = 0, cnt = 0;
  groups.forEach(function(g){
    g.metrics = g.keys.map(function(k){ return M[k]; });
    var s = 0, c = 0;
    g.metrics.forEach(function(x){ if (x.score != null){ x.score = Math.round(x.score * 10) / 10; s += x.score; c++; } });
    g.score = c ? Math.round(s / c * 10) / 10 : null;
    if (g.score != null){ tot += g.score; cnt++; }
  });
  return { score:cnt ? Math.round(tot / cnt * 10) / 10 : null, groups:groups, metrics:M, need:need, fl:fl, bs:bs };
}
/** ช่วงที่ครบแล้วล่าสุด n ช่วง (ใหม่สุดก่อน) สำหรับเฉลี่ยค่าใช้จ่าย */
function donePeriods(mode, cycles, today, n){
  var list = trendPeriods(mode, today, cycles, today, n + 1).filter(function(p){ return p.end < today && !p.open; });
  return list.slice(-n).reverse();
}
/** ตัวเลข → แกนตัวเลขกลม ๆ ที่ครอบทั้งค่าติดลบและบวก */
function niceRange(min, max, count){
  if (min > 0) min = 0; if (max < 0) max = 0;
  if (max === min) max = min + 1;
  var raw = (max - min) / (count || 4), mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), r = raw / mag;

  return out;
}
