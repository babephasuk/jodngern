/** กราฟเส้นความมั่งคั่งสุทธิรายเดือน (ค่าติดลบได้ มีเส้นศูนย์) แตะดูค่าแต่ละเดือน */
function netChart(el, pts){
  if (!pts.length){ el.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }
  var W = 340, H = 180, L = 46, R = 14, T = 14, B = 24, n = pts.length;
  var lo = Infinity, hi = -Infinity;
  pts.forEach(function(p){ lo = Math.min(lo, p.net); hi = Math.max(hi, p.net); });
  var ticks = niceRange(lo, hi, 4), a = ticks[0], b = ticks[ticks.length - 1];
  function x(i){ return L + (n > 1 ? i * (W - L - R) / (n - 1) : (W - L - R) / 2); }
  function y(v){ return T + (H - T - B) * (b - v) / (b - a); }
  var g = '';
  ticks.forEach(function(v){ g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="' + (v === 0 ? 'var(--muted)' : 'var(--grid)') + '" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + shortMoney(v) + '</text>'; });
  pts.forEach(function(p, i){ if (n <= 7 || i % 2 === (n - 1) % 2) g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + escapeHtml(p.label) + '</text>'; });
  g += '<polyline points="' + pts.map(function(p, i){ return x(i).toFixed(1) + ',' + y(p.net).toFixed(1); }).join(' ') + '" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p, i){ g += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.net).toFixed(1) + '" r="' + (i === n - 1 ? 4.5 : 3) + '" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>'; });
  var lx = x(n - 1), ly = y(pts[n - 1].net);
  g += '<text x="' + lx.toFixed(1) + '" y="' + (ly > T + 16 ? ly - 9 : ly + 18).toFixed(1) + '" text-anchor="end" style="fill:var(--ink);font-weight:700">' + shortMoney(pts[n - 1].net) + '</text>';
  g += '<line class="xh" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>';
  g += '<rect x="' + (L - 8) + '" y="0" width="' + (W - L - R + 16) + '" height="' + (H - B) + '" fill="transparent"/>';
  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="กราฟความมั่งคั่งสุทธิรายเดือน">' + g + '</svg><div class="tip" hidden></div>';
  var svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh');
  function at(ev){
    var r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
    var i = Math.max(0, Math.min(n - 1, Math.round((sx - L) / ((W - L - R) / Math.max(1, n - 1))))), p = pts[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    tip.innerHTML = '<div class="h">' + escapeHtml(p.full) + (p.open ? ' (ถึงวันนี้)' : '') + '</div><div class="r">สุทธิ<b>' + fmtMoney(p.net) + '</b></div>' +
      '<div class="r">สินทรัพย์<b>' + fmtMoney(p.asset) + '</b></div><div class="r">หนี้สิน<b>' + fmtMoney(p.liab) + '</b></div>';
    tip.hidden = false; tip.style.top = '0px';
    var px = x(i) / W * r.width;
    tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, px - tip.offsetWidth / 2)) + 'px';
  }
  svg.addEventListener('pointerdown', at);
  svg.addEventListener('pointermove', function(ev){ if (ev.pointerType === 'mouse' || ev.buttons) at(ev); });
  svg.addEventListener('pointerleave', function(ev){ if (ev.pointerType === 'mouse'){ tip.hidden = true; xh.setAttribute('visibility', 'hidden'); } });
}

/** ยอดงบดุล: 0 ได้ (ปิดหนี้แล้ว) */
function parseBal(raw){
  var s = String(raw == null ? '' : raw).trim();
  if (/^[0.,\s]+$/.test(s) && /0/.test(s)) return { ok:true, value:0, cents:0 };
  return parseAmount(s);
}

/** หน้าอัปเดตยอดงบดุล: ใส่ยอดล่าสุดไว้ให้ แก้เฉพาะที่เปลี่ยน บันทึกเฉพาะรายการที่ยอดต่างจากเดิม */
function openBalUpdate(opt){
  opt = opt || {};
  if (!S.bal) return;
  var today = S.boot.today, cur = bsTotals(S.bal, today), vals = {}, notes = {}, showHidden = false, token = newToken(), busy = false;
  var dateVal = today;
  function items(){
    return S.bal.items.filter(function(it){
      if (opt.only) return it.id === opt.only;
      return it.status === 'ใช้งาน' || showHidden || (cur.last[it.id] && cur.last[it.id].amount);
    });
  }
  function curC(id){ var r = cur.last[id]; return r ? Math.round(r.amount * 100) : null; }
  function state(){
    var changed = [], bad = null, net = Math.round(cur.net * 100);
    Object.keys(vals).forEach(function(id){
      var raw = vals[id]; if (raw === undefined) return;
      var it = bsItem(id); if (!it) return;
      if (!String(raw).trim()) return;
      var p = parseBal(raw);
      if (!p.ok){ bad = bad || it.name + ': ' + (p.error || 'ยอดไม่ถูกต้อง'); return; }
      var c0 = curC(id);
      if (c0 === p.cents) return;
      changed.push({ item:id, amount:p.value, note:notes[id] || '' });
      var diff = p.cents - (c0 || 0);
      net += it.side === 'หนี้สิน' ? -diff : diff;
    });
    return { changed:changed, bad:bad, net:net / 100 };
  }
  function rowHtml(it){
    var r = cur.last[it.id], v = vals[it.id] !== undefined ? vals[it.id] : (r ? String(r.amount) : '');
    return '<div class="bsin" data-row="' + escapeHtml(it.id) + '"><label for="bu_' + escapeHtml(it.id) + '"><span class="nm">' + escapeHtml(it.name) + '</span>' +
      '<small>' + (r ? 'ล่าสุด ' + fmtMoney(r.amount) + ' · ' + escapeHtml(thaiDate(r.date)) : 'ยังไม่มียอด') + (it.side === 'หนี้สิน' ? ' · ยอดหนี้คงค้าง' : '') + '</small></label>' +
      '<input class="field" id="bu_' + escapeHtml(it.id) + '" inputmode="decimal" autocomplete="off" data-id="' + escapeHtml(it.id) + '" value="' + escapeHtml(v) + '" placeholder="0"></div>';
  }
  function render(){
    var list = items(), h = '<h2>' + (opt.only ? 'อัปเดตยอด ' + escapeHtml(list[0] ? list[0].name : '') : 'อัปเดตยอดงบดุล') + '</h2>' +
      '<div class="label">วันที่ของยอด</div><input type="date" class="field" id="buDate" max="' + today + '" value="' + dateVal + '">' +
      (opt.only ? '' : '<p class="note">ใส่ยอดล่าสุดไว้ให้แล้ว แก้เฉพาะรายการที่ยอดเปลี่ยน รายการที่ไม่แก้จะไม่ถูกบันทึกซ้ำ · ใส่ 0 ได้เมื่อปิดหนี้หรือเงินหมด</p>');
    BS_GROUPS.forEach(function(g){
      var rows = list.filter(function(it){ return it.group === g; });
      if (!rows.length) return;
      h += '<div class="grp">' + escapeHtml(g) + '</div>' + rows.map(rowHtml).join('');
    });
    if (!opt.only) h += '<label class="chk"><input type="checkbox" id="buHidden"' + (showHidden ? ' checked' : '') + '><span>แสดงรายการที่ซ่อนอยู่</span></label>';
    h += '<div class="stickybar"><div id="buSum" class="small"></div><div class="err-box" id="buErr"></div>' +
      '<div class="row" style="gap:8px"><button class="ghost" id="buClose" style="margin-top:8px;padding:14px 16px">ยกเลิก</button><button class="primary grow" id="buSave">บันทึก</button></div></div>';
    var sh = openSheet(opt.only ? 2 : 1, h);
    sh.oninput = function(e){
      var id = e.target.dataset && e.target.dataset.id;
      if (id){ vals[id] = e.target.value; update(); }
      if (e.target.id === 'buDate') dateVal = e.target.value;
    };
    sh.onchange = function(e){ if (e.target.id === 'buHidden'){ showHidden = e.target.checked; render(); } };
    sh.onclick = function(e){
      if (e.target.id === 'buClose') return closeSheet(opt.only ? 2 : 1);
      if (e.target.id === 'buSave') return save(e.target);
    };
    update();
  }
  function update(){
    var st = state(), box = document.getElementById('buSum'); if (!box) return;
    document.querySelectorAll('.bsin').forEach(function(row){
      var id = row.dataset.row, raw = vals[id];
      var p = raw !== undefined && String(raw).trim() ? parseBal(raw) : null;
      row.classList.toggle('chg', !!(p && p.ok && p.cents !== curC(id)));
      row.classList.toggle('bad', !!(p && !p.ok));
    });
    var d = delta(st.net, cur.net);
    box.innerHTML = st.changed.length
      ? '<b>เปลี่ยน ' + st.changed.length + ' รายการ</b> · ความมั่งคั่งสุทธิหลังบันทึก <b class="' + (st.net < 0 ? 'exp' : 'inc') + '">' + fmtMoney(st.net) + '</b>' +
        '<div class="muted">เดิม ' + fmtMoney(cur.net) + (d && d.dir ? (d.dir > 0 ? ' · ▲ เพิ่มขึ้น ' : ' · ▼ ลดลง ') + fmtMoney(d.diff) : '') + '</div>'
      : '<span class="muted">ยังไม่มีรายการที่ยอดเปลี่ยน</span>';
    $('buErr').textContent = st.bad || '';
    $('buSave').disabled = busy || !st.changed.length || !!st.bad;
  }
  function save(btn){
    var st = state();
    if (!st.changed.length || st.bad) return;
    var d = $('buDate').value;
    if (!d || d > today){ $('buErr').textContent = 'วันที่ต้องไม่เกินวันนี้'; return; }
    busy = true; btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    call('saveBalance', d, st.changed, token).then(function(b){
      useBal(b); closeSheet(opt.only ? 2 : 1);
      if (opt.only) openBalItem(opt.only);
      toast('บันทึกงบดุลแล้ว ' + st.changed.length + ' รายการ');
    }, function(err){
      busy = false; btn.textContent = 'บันทึก'; update();
      $('buErr').textContent = 'บันทึกไม่สำเร็จ: ' + balErrMsg(err) + ' (ข้อมูลที่กรอกยังอยู่ กดบันทึกใหม่ได้)';
    });
  }
  render();
}

/* ---------- เฟส 4: คะแนนสุขภาพการเงิน ---------- */
function healthMode(){ return S.ovMode === 'month' ? 'month' : 'cycle'; }
function healthWord(){ return healthMode() === 'month' ? 'เดือน' : 'รอบ'; }
function periodAgg(p){
  if (storeCovered(S.store, p.start, p.end)) return { agg:aggregate(localRange(p.start, p.end)) };
  var c = S.sumCache[p.start + '|' + p.end];
  if (c) return { agg:aggMerge(c.cats, aggregate(outboxItems(S.outbox, p.start, p.end))), stale:Date.now() - c.at > SUM_TTL };
  return { agg:null };
}
function needSums(ps, aggs){
  var need = []; ps.forEach(function(p, i){ if (!aggs[i].agg || aggs[i].stale) need.push([p.start, p.end]); });
  if (!need.length) return;
  if (S.hErr && Date.now() - S.hErr.at < 30000) return;
  // กราฟแนวโน้มกำลังขอยอดรวมอยู่ (มักครอบช่วงเดียวกัน) รอผลนั้นก่อน แล้วค่อยขอเฉพาะที่ยังขาด
  if (S.sumInflight){
    var pend = JSON.parse(S.sumInflight).map(function(r){ return r[0] + '|' + r[1]; });
    need = need.filter(function(r){ return pend.indexOf(r[0] + '|' + r[1]) < 0; });
    if (!need.length) return;
  }
  var k = JSON.stringify(need);
  if (S.hInflight === k) return;
  S.hInflight = k;
  var at = Date.now();
  call('summarize', need).then(function(res){
    if (S.hInflight === k) S.hInflight = null;
    S.hErr = null;
    res.forEach(function(r){ S.sumCache[r.start + '|' + r.end] = { at:at, cats:r.cats }; });
    drawHealthCards();
  }, function(err){
    if (S.hInflight === k) S.hInflight = null;
    S.hErr = { at:Date.now(), message:balErrMsg(err) };
    drawHealthCards();
  });
}
/** คะแนนตอนนี้ (งบดุลล่าสุด + ค่าเฉลี่ย 3 ช่วงที่ครบแล้ว) และคะแนนช่วงก่อน (งบดุล ณ สิ้นช่วงล่าสุด + 3 ช่วงก่อนหน้านั้น) */
function computeHealth(){
  if (!S.boot) return { wait:true };
  if (!S.bal){
    if (S.balErr) return { err:S.balErr.message };
    loadBal().catch(function(){});
    return { wait:true };
  }
  var mode = healthMode(), word = healthWord(), ps = donePeriods(mode, S.boot.cycles, S.boot.today, 4);
  if (ps.length < 1) return { err:'ยังไม่มี' + word + 'ที่ครบแล้วให้คำนวณ' };
  var aggs = ps.map(periodAgg);
  needSums(ps, aggs);
  if (aggs.some(function(a){ return !a.agg; })) return S.hErr ? { err:S.hErr.message } : { wait:true };
  var fl = aggs.map(function(a){ return flowFigures(a.agg, S.cat); });
  var now = healthScore(bsTotals(S.bal, S.boot.today), avgFlows(fl.slice(0, 3)), word);
  var prev = ps.length >= 2 ? healthScore(bsTotals(S.bal, ps[0].end), avgFlows(fl.slice(1, 4)), word) : null;
  return { h:now, prev:prev, ps:ps.slice(0, 3), word:word };
}
function hClass(s){ return s == null ? '' : s >= 7 ? 'good' : s >= 4 ? 'mid' : 'low'; }
function scoreTxt(s){ return s == null ? '–' : s.toFixed(1); }
function drawHealthCards(){
  var els = document.querySelectorAll('[data-health]'); if (!els.length) return;
  var st = computeHealth(), html;
  if (st.wait) html = '<div class="ctitle"><b>สุขภาพการเงิน</b></div>' + skeletonHtml(1);
  else if (st.err) html = '<div class="ctitle"><b>สุขภาพการเงิน</b></div><div class="err-box">' + escapeHtml(st.err) + '</div><button class="ghost" style="margin-top:8px" data-retry="health">ลองใหม่</button>';
  else {
    var h = st.h, d = st.prev && st.prev.score != null && h.score != null ? Math.round((h.score - st.prev.score) * 10) / 10 : null;
    html = '<button class="hcard" data-open-health><div class="hs"><span class="hscore">' + scoreTxt(h.score) + '</span><small>/10</small></div>' +
      '<div class="grow"><div class="row" style="gap:6px;flex-wrap:wrap"><b>สุขภาพการเงิน</b>' + (h.score != null ? '<span class="hlab ' + hClass(h.score) + '">' + healthLabel(h.score) + '</span>' : '') + '</div>' +
      '<div class="small muted">' + (d == null ? '' : d === 0 ? 'เท่ากับ' + st.word + 'ก่อน · ' : (d > 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1) + ' จาก' + st.word + 'ก่อน · ') +
      'อิงงบดุล ' + escapeHtml(h.bs.date ? thaiDate(h.bs.date) : '-') + '</div>' +
      '<div class="hmini">' + h.groups.map(function(g){ return '<span>' + escapeHtml(g.name) + ' <b class="' + hClass(g.score) + '">' + scoreTxt(g.score) + '</b></span>'; }).join('') + '</div></div><span class="chev">›</span></button>';
  }
  els.forEach(function(el){ el.innerHTML = html; });
  if ($('hSheet')) openHealth(true);
}
document.addEventListener('click', function(e){
  if (e.target.closest('[data-open-health]')) return openHealth();
  var rt = e.target.closest('[data-retry="health"]');
  if (rt){ S.hErr = null; if (S.balErr) S.balErr = null; loadBal(true).catch(function(){}); drawHealthCards(); }
});

/** refresh = ข้อมูลมาเพิ่มระหว่างเปิดหน้านี้อยู่: วาดใหม่ในที่เดิม ไม่เลื่อนกลับขึ้นบน */
function openHealth(refresh){
  var st = computeHealth();
  var seg = '<div id="hSheet"></div><h2>สุขภาพการเงิน</h2>' +
    '<div class="seg" id="hMode" style="margin-bottom:10px"><button data-m="cycle"' + (healthMode() === 'cycle' ? ' class="on"' : '') + '>รอบเงินเดือน</button><button data-m="month"' + (healthMode() === 'month' ? ' class="on"' : '') + '>เดือนปฏิทิน</button></div>';
  var html;
  if (!st.h){
    html = seg + (st.err ? '<div class="err-box">' + escapeHtml(st.err) + '</div><button class="ghost" style="margin-top:8px" data-retry="health">ลองใหม่</button>' : '<div class="card">' + skeletonHtml(4) + '</div>') +
      '<button class="ghost" style="width:100%" data-a="close">ปิด</button>';
  } else {
  var h = st.h, ps = st.ps, d = st.prev && st.prev.score != null && h.score != null ? Math.round((h.score - st.prev.score) * 10) / 10 : null;
  html = seg +
    '<div class="card" style="text-align:center"><span class="hscore big">' + scoreTxt(h.score) + '</span><small class="muted"> / 10</small>' +
    (h.score != null ? '<div><span class="hlab ' + hClass(h.score) + '">' + healthLabel(h.score) + '</span></div>' : '') +
    '<div class="small muted" style="margin-top:6px">' + (d == null ? 'ยังไม่มีคะแนน' + st.word + 'ก่อนให้เทียบ' : d === 0 ? 'เท่ากับ' + st.word + 'ก่อน' : (d > 0 ? '▲ ดีขึ้น ' : '▼ ลดลง ') + Math.abs(d).toFixed(1) + ' จาก' + st.word + 'ก่อน (' + scoreTxt(st.prev.score) + ')') + '</div></div>' +
    '<p class="note">อิงงบดุล ณ ' + escapeHtml(h.bs.date ? thaiDate(h.bs.date) : '-') + ' · รายรับรายจ่ายเฉลี่ยของ ' + ps.length + ' ' + st.word + 'ที่ครบแล้ว (' +
      escapeHtml(thaiDate(ps[ps.length - 1].start) + ' – ' + thaiDate(ps[0].end)) + ') · ค่าใช้จ่ายจำเป็นเฉลี่ย ' + fmtMoney(h.need) + ' ต่อ' + st.word + '</p>';
  h.groups.forEach(function(g){
    html += '<div class="card"><div class="ctitle"><b>' + escapeHtml(g.name) + '</b><span><b class="' + hClass(g.score) + '">' + scoreTxt(g.score) + '</b> / 10' + (g.score != null ? ' · ' + healthLabel(g.score) : '') + '</span></div>' +
      '<div class="meter"><i class="' + hClass(g.score) + '" style="width:' + ((g.score || 0) * 10) + '%"></i></div>';
    g.metrics.forEach(function(m){
      html += '<div class="hm"><div class="row between"><span>' + escapeHtml(m.name) + '</span><b>' + escapeHtml(m.value) + '</b></div>' +
        '<div class="small">' + escapeHtml(m.text) + '</div><div class="small muted">เกณฑ์: ' + escapeHtml(m.target) + (m.score != null ? ' · คะแนน ' + m.score.toFixed(1) : m.info ? '' : ' · ไม่นับคะแนน') + '</div></div>';
    });
    html += '</div>';
  });
  html += '<p class="note">คะแนนรวม = เฉลี่ย 4 กลุ่มเท่ากัน แต่ละกลุ่มเฉลี่ยจากตัวชี้วัดในกลุ่ม · ค่าใช้จ่ายจำเป็น = ใช้จ่ายจริง (หักเงินที่เพื่อนหาร) + ผ่อนหนี้ ไม่นับเงินออม · ' +
    'ผลตอบแทนจากสินทรัพย์นับดอกเบี้ย ปันผล ค่าเช่า ไม่นับเงินขายสินทรัพย์ · เกณฑ์เป็นเกณฑ์ทั่วไปแบบที่แอปเดิมใช้ ใช้ประกอบการตัดสินใจ ไม่ใช่คำแนะนำทางการเงิน</p>' +
    '<button class="ghost" style="width:100%" data-a="close">ปิด</button>';
  }
  var keep = refresh ? $('sh1').scrollTop : 0;
  if (refresh && $('sh1').innerHTML === html) return;
  var sh = openSheet(1, html);
  sh.scrollTop = keep;
  sh.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'close') return closeSheet(1);
    if (b.dataset.m && b.dataset.m !== healthMode()){
      S.ovMode = b.dataset.m; LS.set('ovMode', S.ovMode); S.ovAnchor = S.boot.today;
      if (S.tab === 'over') loadOverview();
      openHealth();
      drawHealthCards();
    }
  };
}

/* ---------- เฟส 5: ส่งออกและสำรอง ---------- */
function saveFile(name, text){
  var blob = new Blob([csvBlobText(text)], { type:'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  return blob;
}
function openExport(){
  var y = isoParts(S.boot.today)[0], last = null;
  var KINDS = [
    ['tx', [], 'รายการรายรับรายจ่ายทั้งหมด'],
    ['tx', [y + '-01-01', S.boot.today], 'รายการปี ' + (y + 543) + ' (ถึงวันนี้)'],
    ['bs', [], 'งบดุลรายเดือน (ประวัติทั้งหมด)'],
    ['cat', [], 'หมวดหมู่'],
    ['bsi', [], 'รายการงบดุล']
  ];
  var sh = openSheet(1, '<h2>ส่งออกข้อมูล (CSV)</h2><div class="list">' +
    KINDS.map(function(k, i){ return '<button data-k="' + i + '">📄 <span class="grow">' + escapeHtml(k[2]) + '</span></button>'; }).join('') + '</div>' +
    '<div id="exOut" class="small" style="margin-top:10px"></div>' +
    '<p class="muted small">ไฟล์ CSV เปิดด้วย Excel หรือ Google Sheets ได้ ภาษาไทยไม่เพี้ยน วันที่เป็น ค.ศ. · ไฟล์มีข้อมูลการเงิน เก็บในที่ปลอดภัย · ' +
    'ข้อมูลตัวจริงอยู่ใน Google Sheet อยู่แล้ว ดาวน์โหลดทั้งไฟล์เป็น Excel ได้จากชีต (ไฟล์ → ดาวน์โหลด)</p>' +
    '<button class="ghost" style="width:100%" data-a="close">ปิด</button>');
  sh.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'close') return closeSheet(1);
    if (b.dataset.a === 'again' && last) return saveFile(last.name, last.csv);
    if (b.dataset.a === 'share' && last){
      var f = new File([csvBlobText(last.csv)], last.name, { type:'text/csv' });
      return navigator.share({ files:[f], title:last.name }).catch(function(){});
    }
    if (b.dataset.k === undefined || b.disabled) return;
    var k = KINDS[Number(b.dataset.k)];
    sh.querySelectorAll('[data-k]').forEach(function(x){ x.disabled = true; });
    $('exOut').innerHTML = '<span class="muted">กำลังเตรียมไฟล์ ' + escapeHtml(k[2]) + '…</span>';
    call.apply(null, ['exportCsv', k[0]].concat(k[1])).then(function(res){
      last = res;
      saveFile(res.name, res.csv);
      var canShare = false;
      try { canShare = !!(navigator.canShare && navigator.canShare({ files:[new File(['x'], 'x.csv', { type:'text/csv' })] })); } catch(err){}
      $('exOut').innerHTML = '✅ <b>' + escapeHtml(res.name) + '</b> · ' + fmtMoney(res.rows) + ' แถว (ดูในโฟลเดอร์ดาวน์โหลด)' +
        '<div class="row" style="margin-top:8px"><button class="ghost" data-a="again">ดาวน์โหลดอีกครั้ง</button>' + (canShare ? '<button class="ghost" data-a="share">แชร์ / บันทึกไปที่อื่น</button>' : '') + '</div>';
    }, function(err){
      $('exOut').innerHTML = '<div class="err-box">ส่งออกไม่สำเร็จ: ' + escapeHtml(balErrMsg(err)) + '</div>';
    }).then(function(){ sh.querySelectorAll('[data-k]').forEach(function(x){ x.disabled = false; }); });
  };
}
function backupHtml(info){
  if (!info) return '<span class="muted">กำลังโหลดสถานะ…</span>';
  var l = info.last;
  return '<div class="row between"><span>สำรองล่าสุด</span><b>' + (l ? escapeHtml(thaiDate(l.at.slice(0, 10)) + ' ' + l.at.slice(11) + ' น.') : 'ยังไม่เคย') + '</b></div>' +
    (l ? '<div class="small muted">' + escapeHtml(l.name) + ' · โฟลเดอร์ "' + escapeHtml(l.folder || '') + '"</div>' : '') +
    '<div class="row between" style="margin-top:8px"><span>สำรองอัตโนมัติวันที่ 1 ทุกเดือน</span><b class="' + (info.auto ? 'inc' : 'exp') + '">' + (info.auto ? 'เปิดอยู่' : 'ยังไม่ได้ตั้ง') + '</b></div>' +
    (info.auto ? '' : '<div class="small muted">ตั้งได้โดยเปิดหน้า Apps Script เลือกฟังก์ชัน setupBackup แล้วกด Run หนึ่งครั้ง</div>');
}
function openBackup(){
  var sh = openSheet(1, '<h2>สำรองข้อมูล</h2><div class="card" id="bkInfo">' + backupHtml(S.bal && S.bal.backup) + '</div>' +
    '<div class="err-box" id="bkErr"></div><button class="primary" id="bkNow">สำรองตอนนี้</button>' +
    '<p class="muted small">ทำสำเนาทั้งไฟล์ชีตไว้ในโฟลเดอร์ "สำรอง แอปการเงินของเบ๊บ" ข้างไฟล์ชีตใน Google Drive ของเบ๊บ แอปไม่ลบสำเนาเก่าเอง · ' +
    'Google Sheets มีประวัติการแก้ไขอีกชั้น (ไฟล์ → ประวัติเวอร์ชัน)</p><button class="ghost" style="width:100%" id="bkClose">ปิด</button>');
  loadBal(true).then(function(b){ var el = $('bkInfo'); if (el) el.innerHTML = backupHtml(b.backup); }, function(err){ var el = $('bkErr'); if (el) el.textContent = err.message; });
  sh.onclick = function(e){
    var t = e.target;
    if (t.id === 'bkClose') return closeSheet(1);
    if (t.id !== 'bkNow') return;
    t.disabled = true; t.textContent = 'กำลังสำรอง… (ราว 10–30 วินาที)'; $('bkErr').textContent = '';
    call('backupNow').then(function(res){
      if (S.bal) S.bal.backup = { last:res.last, auto:res.auto };
      $('bkInfo').innerHTML = backupHtml({ last:res.last, auto:res.auto });
      t.textContent = res.reused ? 'เพิ่งสำรองไปไม่ถึง 10 นาที ใช้สำเนาเดิม' : '✅ สำรองแล้ว';
      toast(res.reused ? 'มีสำเนาที่เพิ่งสำรองแล้ว' : 'สำรองข้อมูลแล้ว');
    }, function(err){
      t.disabled = false; t.textContent = 'สำรองตอนนี้'; $('bkErr').textContent = balErrMsg(err);
    });
  };
}

/* ---------- หน้าตั้งค่า ---------- */
$('btnSet').onclick = function(){
  bioAvailable().then(function(av){
    var sh = openSheet(1, '<h2>ตั้งค่า</h2><div class="list">' +
      '<button data-s="lock">🔒 <span class="grow">ล็อกแอปตอนนี้</span></button>' +
      (av ? '<button data-s="bio">👆 <span class="grow">ลายนิ้วมือ / Face ID</span><b>' + (bioOn() ? 'เปิดอยู่' : 'ปิดอยู่') + '</b></button>' : '') +
      '<button data-s="pin">🔢 <span class="grow">เปลี่ยน PIN</span></button>' +
      '<button data-s="export">📤 <span class="grow">ส่งออกข้อมูล (CSV)</span></button>' +
      '<button data-s="backup">🗄️ <span class="grow">สำรองข้อมูล</span></button>' +
      '<button data-s="speed">⚡ <span class="grow">ทดสอบความเร็ว</span></button>' +
      '<button data-s="wipe" class="exp">🧹 <span class="grow">ล้างการตั้งค่าเครื่องนี้</span></button></div>' +
      '<div class="err-box" id="setErr"></div>' +
      '<p class="muted small">ล็อกอัตโนมัติเมื่อออกจากแอปเกิน 1 นาที · เครื่องนี้เก็บแค่ลิงก์ API กุญแจ PIN แบบแฮช และรายชื่อหมวด/รอบเงินเดือน (ไม่มีจำนวนเงิน) ' +
        'ยกเว้นรายการหรือแม่แบบที่กดบันทึกแล้วแต่ยังส่งไม่สำเร็จ ซึ่งพักไว้ในเครื่องจนส่งสำเร็จแล้วลบทิ้ง ข้อมูลเงินทั้งหมดอยู่ใน Google Sheet</p>' +
      '<p class="muted small">หน้าแอป v' + CLIENT_VERSION + ' · เซิร์ฟเวอร์ v' + escapeHtml(S.boot ? S.boot.version : '-') + ' · ' + escapeHtml(shortUrl(S.api)) + '</p>' +
      '<button class="ghost" style="width:100%" data-s="close">ปิด</button>');
    sh.onclick = function(e){
      var b = e.target.closest('button'); if (!b) return;
      var a = b.dataset.s;
      if (a === 'close') return closeSheet(1);
      if (a === 'lock'){ closeSheet(1); return gateLock(); }
      if (a === 'pin'){ closeSheet(1); return gatePinNew({ change:true }); }
      if (a === 'bio'){
        if (bioOn()){ LS.del('bio'); LS.del('cred'); closeSheet(1); return toast('ปิดลายนิ้วมือแล้ว (ลบพาสคีย์เก่าได้ในตัวจัดการรหัสผ่านของเครื่อง)'); }
        b.disabled = true;
        return bioRegister().then(function(){ closeSheet(1); toast('เปิดใช้ลายนิ้วมือแล้ว'); })
          .catch(function(err){ b.disabled = false; $('setErr').textContent = bioErrMsg(err); });
      }
      if (a === 'speed'){ closeSheet(1); return speedTest(); }
      if (a === 'export'){ if (!S.boot) return; return openExport(); }
      if (a === 'backup'){ if (!S.boot) return; return openBackup(); }
      if (a === 'wipe'){
        var waiting = 0; S.outbox.forEach(function(en){ waiting += entryCount(en); });
        if (!b.dataset.sure){ b.dataset.sure = '1'; b.querySelector('.grow').textContent = waiting
          ? 'มีรายการยังไม่ได้ส่ง ' + waiting + ' รายการ จะหายไปด้วย แตะอีกครั้งถ้าแน่ใจ'
          : 'แตะอีกครั้งเพื่อยืนยัน (ข้อมูลในชีตไม่หาย)'; return; }
        wipeDevice(); location.reload();
      }
    };
  });
};

/* ---------- เปิดแอป ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(function(){});
  // มีเวอร์ชันใหม่จาก GitHub: ถ้ายังไม่ได้กรอกอะไรค้างไว้ เปิดใหม่ให้เลย ไม่ต้องปิดเปิดแอปเอง
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!hadController) return;
    var idle = !S.addForm || S.addForm.pristine();
    if (idle && $('ov1').hidden && $('ov2').hidden) return location.reload();
    toast('มีแอปเวอร์ชันใหม่ ปิดแล้วเปิดแอปอีกครั้งเพื่อใช้');
  });
}
(function boot(){
  S.api = LS.get('api'); S.key = LS.get('key');
  if (!S.api || !S.key) return gateSetup('');
  if (!LS.get('pinHash')) return gatePinNew({});
  gateLock();
  startApp();   // โหลดข้อมูลรอไว้หลังหน้าล็อก (หน้าล็อกทึบ มองไม่เห็นข้อมูล)
})();
</script>
