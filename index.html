function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  if (!S.api || !S.key) return Promise.reject(new Error('ยังไม่ได้ตั้งค่าเครื่องนี้'));
  return apiPost(S.api, S.key, fn, args).catch(function(e){
    if (e.code === 'AUTH') authFailed();
    throw e;
  });
}

var toastTimer;
function toast(msg, isErr){
  var t = $('toast');
  t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, isErr ? 6000 : 2200);
}

function openSheet(level, html){
  var ov = $('ov' + level), sh = $('sh' + level);
  sh.onclick = sh.oninput = sh.onchange = null;  // ล้างตัวจับเหตุการณ์ของหน้าก่อน
  sh.innerHTML = html; ov.hidden = false; sh.scrollTop = 0;
  return sh;
}
function closeSheet(level){ $('ov' + level).hidden = true; $('sh' + level).innerHTML = ''; }
['1','2'].forEach(function(l){
  $('ov' + l).addEventListener('click', function(e){ if (e.target === this) closeSheet(l); });
});

/* ---------- ชั้นข้อมูล: แสดงจากที่จำไว้ทันที ขอจากชีตเฉพาะที่ยังไม่รู้หรือเก่าเกิน ---------- */
function deviceToday(){ return localIso(new Date()); }

/** ขอรายการช่วง s..e จากชีต (ช่วงเดียวกันที่กำลังขออยู่ ใช้คำขอเดิมร่วมกัน) */
function fetchRange(s, e){
  var k = s + '|' + e;
  if (S.inflight[k]) return S.inflight[k];
  var startedAt = Date.now();
  var p = call('listTransactions', s, e).then(function(list){
    storeMerge(S.store, s, e, list, startedAt);
    delete S.inflight[k];
    return list;
  }, function(err){ delete S.inflight[k]; throw err; });
  S.inflight[k] = p;
  return p;
}

/** รายการที่จะแสดงในช่วง s..e = ที่ยืนยันแล้ว + ที่ยังรอส่ง */
function localRange(s, e){ return viewSort(storeQuery(S.store, s, e).concat(outboxItems(S.outbox, s, e))); }

/**
 * แสดงช่วง s..e: draw(list) ถูกเรียกทันทีถ้ามีข้อมูล (และอีกครั้งเมื่อได้ของใหม่)
 * draw(null) = ยังไม่มีข้อมูล ให้แสดงโครงรอโหลด, fail(err) = โหลดไม่สำเร็จ
 */
function viewRange(s, e, draw, fail){
  var at = storeCovered(S.store, s, e);
  if (at){
    draw(localRange(s, e));
    if (Date.now() - at > STALE_MS) fetchRange(s, e).then(function(){ draw(localRange(s, e)); }, function(){});
    return;
  }
  draw(null);
  if (S.bootPending && !S.bootLive) return;   // ข้อมูลตั้งต้นกำลังมา (มีรายการของรอบนี้ติดมาด้วย) ไม่ต้องขอซ้ำ
  fetchRange(s, e).then(function(){ draw(localRange(s, e)); }, function(err){ fail(err); });
}

/** โหลดล่วงหน้าแบบเงียบ (ไม่แสดงอะไรถ้าไม่สำเร็จ) */
function prefetch(s, e){
  if (!s || !e || s > e || storeCovered(S.store, s, e) || !S.boot) return;
  fetchRange(s, e).catch(function(){});
}

function skeletonHtml(n){
  var h = '';
  for (var i = 0; i < (n || 3); i++) h += '<div class="sk"><i class="c"></i><span class="grow"><i style="width:' + (55 + (i*17)%35) + '%"></i><i style="width:30%;margin-top:6px;height:9px"></i></span><i style="width:56px"></i></div>';
  return h;
}

/** วาดหน้าที่เปิดอยู่ใหม่จากข้อมูลในเครื่อง (เร็ว ไม่เรียกเซิร์ฟเวอร์ถ้าข้อมูลยังใหม่) */
function rerender(){
  if (!S.boot) return;
  refreshDay();
  if (S.tab === 'list') loadList();
  if (S.tab === 'over') loadOverview();
  syncBadge();
}

/* ---------- คิวรายการที่ยังไม่ได้ส่ง (บันทึกขึ้นก่อน ส่งทีหลัง) ---------- */
function loadOutbox(){
  try { S.outbox = JSON.parse(LS.get('outbox') || '[]') || []; } catch(e){ S.outbox = []; }
  // ถ้าแอปปิดไปตอนกำลังส่ง ให้ส่งใหม่ด้วย token เดิม (เซิร์ฟเวอร์กันบันทึกซ้ำให้)
  S.outbox.forEach(function(en){ if (en.state === 'sending') en.state = 'wait'; });
}
function saveOutbox(){ if (S.outbox.length) LS.set('outbox', JSON.stringify(S.outbox)); else LS.del('outbox'); }
function findEntry(token){ for (var i = 0; i < S.outbox.length; i++) if (S.outbox[i].token === token) return S.outbox[i]; return null; }

function enqueue(source, items, token){
  S.outbox.push({ token:token, source:source, items:items, at:Date.now(), state:'wait', err:'' });
  saveOutbox();
  items.forEach(function(it){
    S.boot.lastAmount[it.catId] = it.amount;
    S.boot.usage[it.catId] = (S.boot.usage[it.catId] || 0) + 1;
  });
  rerender();
  S.retryDelay = 0;
  flushOutbox();
}

/** แม่แบบวันเงินเดือนที่แก้ในเครื่อง: ใช้ทันที แล้วส่งเข้าชีตตามหลังรายการเงิน (ส่งเฉพาะฉบับล่าสุด) */
function enqueueTemplate(rows){
  S.outbox = S.outbox.filter(function(en){ return !(en.kind === 'tpl' && en.state !== 'sending'); });
  S.outbox.push({ token:newToken(), kind:'tpl', source:'แม่แบบ', rows:rows, items:[], at:Date.now(), state:'wait', err:'' });
  saveOutbox();
  S.boot.template = templateLocal(rows, S.cat);
  syncBadge();
  S.retryDelay = 0;
  flushOutbox();
}
function entryCount(en){ return en.kind === 'tpl' ? 1 : en.items.length; }
function friendlyErr(err){ return err.code === 'BAD_ACTION' ? 'เซิร์ฟเวอร์ยังเป็นเวอร์ชันเก่า อัปเดต Code.gs เป็น 4.0.0 (Deploy เป็น New version) แล้วกดส่งใหม่' : err.message; }

/** ส่งคิวทีละชุดตามลำดับ ชุดที่ข้อมูลผิด (เช่น หมวดถูกเลิกใช้) ข้ามไปและรอให้แก้ */
function flushOutbox(){
  if (S.flushing || !S.api || !S.key) return;
  var en = null;
  for (var i = 0; i < S.outbox.length; i++) if (S.outbox[i].state === 'wait'){ en = S.outbox[i]; break; }
  if (!en){ syncBadge(); return; }
  clearTimeout(S.retryTimer);
  S.flushing = true; en.state = 'sending'; saveOutbox(); rerender();
  var req = en.kind === 'tpl' ? call('saveTemplate', en.rows) : call('addTransactions', en.items, en.source, en.token);
  req.then(function(res){
    var now = Date.now();
    if (en.kind === 'tpl'){
      if (!S.outbox.some(function(x){ return x !== en && x.kind === 'tpl'; }) && Array.isArray(res)) S.boot.template = res;
    } else savedItems(res, en).forEach(function(x){ storePut(S.store, x, now); sumDirty(x.date); });
    S.outbox = S.outbox.filter(function(x){ return x !== en; });
    saveOutbox();
    S.flushing = false; S.retryDelay = 0;
    rerender();
    flushOutbox();
  }).catch(function(err){
    S.flushing = false;
    if (err.code === 'AUTH'){ en.state = 'wait'; saveOutbox(); syncBadge(); return; }
    if (retryable(err)){
      en.state = 'wait'; en.err = err.message; saveOutbox(); rerender();
      S.retryDelay = nextDelay(S.retryDelay);
      clearTimeout(S.retryTimer);
      S.retryTimer = setTimeout(flushOutbox, S.retryDelay);
      return;
    }
    en.state = 'failed'; en.err = friendlyErr(err); saveOutbox(); rerender();
    toast((en.kind === 'tpl' ? 'จำแม่แบบเข้าชีตไม่สำเร็จ: ' : 'ส่งรายการไม่สำเร็จ: ') + en.err, true);
    flushOutbox();
  });
}

function syncBadge(){
  var b = $('btnSync'); if (!b) return;
  var wait = 0, bad = 0;
  S.outbox.forEach(function(en){ if (en.state === 'failed') bad += entryCount(en); else wait += entryCount(en); });
  b.hidden = !(wait || bad);
  b.className = 'syncbtn' + (bad ? ' bad' : '');
  b.textContent = bad ? '⚠️ ส่งไม่สำเร็จ ' + bad : (S.flushing ? '⏳ กำลังส่ง ' + wait : '⏳ รอส่ง ' + wait);
}

/** หน้ารายการที่ยังไม่ได้ส่ง: ส่งใหม่ / แก้ / ลบทิ้ง */
function openOutbox(){
  if (!S.outbox.length){ closeSheet(1); return; }
  var items = viewSort(outboxItems(S.outbox, '0000-01-01', '9999-12-31'));
  var anyErr = S.outbox.filter(function(en){ return en.err; })[0];
  var sh = openSheet(1, '<h2>รายการที่ยังไม่ได้ส่งเข้าชีต</h2>' +
    '<p class="muted small">บันทึกไว้ในเครื่องนี้แล้ว แอปส่งให้เองเมื่อเน็ตกลับมา ไม่ต้องกรอกซ้ำ · แตะรายการเพื่อแก้หรือลบ</p>' +
    (anyErr ? '<div class="err-box">ล่าสุด: ' + escapeHtml(anyErr.err) + '</div>' : '') +
    '<div class="card" style="padding:4px 10px;margin-top:10px">' + items.map(txRowHtml).join('') + S.outbox.filter(function(en){ return en.kind === 'tpl'; }).map(function(en){
      return '<button class="tx pending' + (en.state === 'failed' ? ' failed' : '') + '" data-tpl="' + escapeHtml(en.token) + '"><span class="ic">📝</span><span class="grow"><div class="t1">แม่แบบวันเงินเดือน (' + en.rows.length + ' รายการ)</div>' +
        '<div class="t2">' + (en.state === 'failed' ? 'ส่งไม่สำเร็จ · แตะเพื่อทิ้งการแก้นี้' : en.state === 'sending' ? 'กำลังส่ง…' : 'รอส่ง · แตะเพื่อทิ้งการแก้นี้') + '</div></span></button>';
    }).join('') + '</div>' +
    '<button class="primary" id="obSend">ส่งทั้งหมดอีกครั้ง</button><button class="ghost" style="width:100%;margin-top:10px" id="obClose">ปิด</button>');
  sh.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'obClose') return closeSheet(1);
    if (b.id === 'obSend'){
      S.outbox.forEach(function(en){ if (en.state === 'failed') en.state = 'wait'; });
      saveOutbox(); S.retryDelay = 0; flushOutbox(); closeSheet(1); toast('กำลังส่ง…'); return;
    }
    if (b.dataset.tpl){
      var en = findEntry(b.dataset.tpl);
      if (!en || en.state === 'sending') return;
      if (!b.dataset.sure){ b.dataset.sure = '1'; b.querySelector('.t2').textContent = 'แตะอีกครั้งเพื่อทิ้ง (แม่แบบในชีตคงเดิม)'; return; }
      S.outbox = S.outbox.filter(function(x){ return x !== en; }); saveOutbox(); syncBadge();
      toast('ทิ้งการแก้แม่แบบแล้ว'); loadBoot(); openOutbox(); return;
    }
    if (b.dataset.tx){ var x = items.filter(function(t){ return t.id === b.dataset.tx; })[0]; if (x) openEdit(x, function(){ if (S.outbox.some(function(en){ return en.state === 'failed'; })) openOutbox(); }); }
  };
}
$('btnSync').onclick = openOutbox;

/* ---------- ตัวเลือกหมวด ---------- */
function pickCategory(type, onPick){
  var cats = S.boot.cats.filter(function(c){ return c.type === type && c.status !== 'เลิกใช้'; });
  var usage = S.boot.usage;
  var top = cats.filter(function(c){ return c.status === 'ใช้งาน' && usage[c.id]; })
    .sort(function(a,b){ return usage[b.id] - usage[a.id]; }).slice(0, 9);
  var mains = [], seen = {};
  cats.forEach(function(c){
    var k = c.group + '|' + c.main;
    if (!seen[k]){ seen[k] = {group:c.group, main:c.main, icon:c.icon, subs:[], hidden:true}; mains.push(seen[k]); }
    seen[k].subs.push(c);
    if (c.status === 'ใช้งาน') seen[k].hidden = false;
  });
  var html = '<h2>เลือกหมวด' + type + '</h2>';
  if (top.length){
    html += '<div class="grp">ใช้บ่อย</div><div class="grid">' + top.map(function(c){
      return '<button class="tile" data-id="' + c.id + '"><span class="ic">' + escapeHtml(c.icon) + '</span>' + escapeHtml(catLabel(c)) + '</button>';
    }).join('') + '</div>';
  }
  var groups = [], gUse = {};
  mains.forEach(function(m){
    if (m.hidden) return;
    if (groups.indexOf(m.group) < 0) groups.push(m.group);
    m.subs.forEach(function(c){ gUse[m.group] = (gUse[m.group] || 0) + (usage[c.id] || 0); });
  });
  groups.sort(function(a,b){ return (gUse[b] || 0) - (gUse[a] || 0); });  // กลุ่มที่ใช้บ่อยขึ้นก่อน
  groups.forEach(function(g){
    html += '<div class="grp">' + escapeHtml(g) + '</div><div class="grid">' + mains.filter(function(m){ return m.group === g && !m.hidden; }).map(function(m){
      return '<button class="tile" data-main="' + escapeHtml(m.group + '|' + m.main) + '"><span class="ic">' + escapeHtml(m.icon) + '</span>' + escapeHtml(m.main) + '</button>';
    }).join('') + '</div>';
  });
  var hiddenMains = mains.filter(function(m){ return m.hidden; });
  if (hiddenMains.length){
    html += '<div class="grp">หมวดที่ซ่อน</div><div class="grid">' + hiddenMains.map(function(m){
      return '<button class="tile" data-main="' + escapeHtml(m.group + '|' + m.main) + '"><span class="ic">' + escapeHtml(m.icon) + '</span>' + escapeHtml(m.main) + '</button>';
    }).join('') + '</div>';
  }
  var sh = openSheet(2, html);
  sh.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.id){ closeSheet(2); onPick(S.cat[b.dataset.id]); return; }
    if (b.dataset.main){
      var m = seen[b.dataset.main];
      if (m.subs.length === 1){ closeSheet(2); onPick(m.subs[0]); return; }
      var h2 = '<h2>' + escapeHtml(m.icon + ' ' + m.main) + '</h2><div class="list">' + m.subs.map(function(c){
        return '<button data-id="' + c.id + '"><span class="grow">' + escapeHtml(c.sub) + (c.status !== 'ใช้งาน' ? ' <span class="muted">(ซ่อน)</span>' : '') + '</span>' +
          (usage[c.id] ? '<small class="muted">ใช้ ' + usage[c.id] + ' ครั้ง</small>' : '') + '</button>';
      }).join('') + '</div><button class="ghost" style="margin-top:12px" data-back="1">‹ กลับ</button>';
      sh.innerHTML = h2; sh.scrollTop = 0;
    }
    if (b.dataset.back){ closeSheet(2); pickCategory(type, onPick); }
  };
}

/* ---------- ฟอร์มรายการ (ใช้ทั้งเพิ่มและแก้ไข) ---------- */
function makeForm(box, init, opts){
  var f = { type:init.type || 'รายจ่าย', catId:init.catId || '', meals:(init.meals || []).slice(),
            date:init.date || S.boot.today, note:init.note || '', amount: init.amount ? String(init.amount) : '', token:newToken(), busy:false };

  function starChips(){
    var u = S.boot.usage;
    return S.boot.cats.filter(function(c){ return c.star && c.type === f.type && c.status !== 'เลิกใช้'; })
      .sort(function(a,b){ return (u[b.id] || 0) - (u[a.id] || 0); }).map(function(c){
      return '<button class="chip' + (c.id === f.catId ? ' on' : '') + '" data-star="' + c.id + '">' + escapeHtml(c.icon + ' ' + catLabel(c)) + '</button>';
    }).join('');
  }
  function render(){
    var c = S.cat[f.catId];
    var food = c && c.main === 'อาหาร';
    box.innerHTML =
      '<div class="seg">' + ['รายจ่าย','รายได้'].map(function(t){ return '<button data-v="' + t + '" class="' + (f.type === t ? 'on' : '') + '">' + t + '</button>'; }).join('') + '</div>' +
      (opts.edit ? '' : '<div class="label">ใช้ประจำ</div><div class="chips">' + starChips() + '</div>') +
      '<div class="label">หมวด</div>' +
      '<button class="pick" data-act="pick"><span class="ic">' + (c ? escapeHtml(c.icon) : '＋') + '</span><span class="grow">' +
        (c ? '<b>' + escapeHtml(catLabel(c)) + '</b>' + (c.sub !== c.main ? ' <span class="muted">· ' + escapeHtml(c.main) + '</span>' : '') : '<span class="muted">แตะเพื่อเลือกหมวด</span>') +
      '</span><span class="muted">›</span></button>' +
      '<div class="label">จำนวนเงิน (พิมพ์บวก/ลบได้ เช่น 120+45-10)</div>' +
      '<div class="amount"><input class="field" id="' + opts.prefix + 'amt" inputmode="decimal" autocomplete="off" placeholder="0" value="' + escapeHtml(f.amount) + '">' +
        '<button class="op" data-op="+">＋</button><button class="op" data-op="-">−</button></div>' +
      '<div class="calc" id="' + opts.prefix + 'calc"></div>' +
      (food ? '<div class="label">มื้อ (เลือกได้หลายมื้อ)</div><div class="meals">' + MEAL_LIST.map(function(m){
        return '<button data-meal="' + m[0] + '" class="' + (f.meals.indexOf(m[0]) >= 0 ? 'on' : '') + '">' + m[1] + ' ' + m[0] + '</button>'; }).join('') + '</div>' : '') +
      '<div class="label">รายละเอียด (ไม่บังคับ)</div><input class="field" id="' + opts.prefix + 'note" maxlength="300" value="' + escapeHtml(f.note) + '">' +
      '<div class="label">วันที่</div><div class="dateline"><input type="date" class="field" id="' + opts.prefix + 'date" value="' + f.date + '"><span class="be" id="' + opts.prefix + 'be">' + thaiDate(f.date, true) + '</span></div>' +
      '<div class="err-box" id="' + opts.prefix + 'err"></div>' +
      '<button class="primary" data-act="save">' + (opts.edit ? 'บันทึกการแก้ไข' : 'บันทึก') + '</button>' +
      (opts.edit ? '<div class="row" style="margin-top:10px"><button class="ghost danger grow" data-act="del">ลบรายการนี้</button><button class="ghost grow" data-act="close">ปิด</button></div>' : '');
    showCalc();
  }
  function amtEl(){ return $(opts.prefix + 'amt'); }
  function showCalc(){
    var r = parseAmount(f.amount), el = $(opts.prefix + 'calc');
    if (!el) return;
    if (r.ok) el.innerHTML = r.isExpr ? '<b>= ' + fmtMoney(r.value) + ' บาท</b>' : '';
    else el.innerHTML = r.error ? '<span class="exp">' + escapeHtml(r.error) + '</span>' : '';
  }
  function setCat(c){
    f.catId = c.id; f.type = c.type;
    if (!opts.edit && !f.amount && S.boot.lastAmount[c.id]) f.amount = String(S.boot.lastAmount[c.id]);
    if (c.main !== 'อาหาร') f.meals = [];
    render();
  }
  box.oninput = function(e){
    if (e.target.id === opts.prefix + 'amt'){ f.amount = e.target.value; showCalc(); }
    if (e.target.id === opts.prefix + 'note') f.note = e.target.value;
    if (e.target.id === opts.prefix + 'date'){ f.date = e.target.value; $(opts.prefix + 'be').textContent = f.date ? thaiDate(f.date, true) : ''; if (opts.onDate) opts.onDate(f.date); }
  };
  box.onclick = function(e){
    var b = e.target.closest('button'); if (!b || f.busy) return;
    if (b.dataset.v && b.dataset.v !== f.type){ f.type = b.dataset.v; f.catId = ''; f.meals = []; render(); return; }
    if (b.dataset.star){ var sc = S.cat[b.dataset.star]; f.amount = ''; setCat(sc); var a = amtEl(); if (a){ a.focus(); a.select(); } return; }
    if (b.dataset.act === 'pick'){ pickCategory(f.type, setCat); return; }
    if (b.dataset.op){ f.amount = (f.amount || '').replace(/[+\-]$/, '') + b.dataset.op; var el = amtEl(); el.value = f.amount; el.focus(); showCalc(); return; }
    if (b.dataset.meal){ var i = f.meals.indexOf(b.dataset.meal); if (i >= 0) f.meals.splice(i,1); else f.meals.push(b.dataset.meal); b.classList.toggle('on'); return; }
    if (b.dataset.act === 'save') return save(b);
    if (b.dataset.act === 'del') return del(b);
    if (b.dataset.act === 'close') return opts.onClose && opts.onClose();
  };
  function fail(msg){ $(opts.prefix + 'err').textContent = msg; }
  function collect(){
    var c = S.cat[f.catId];
    if (!c) return fail('ยังไม่ได้เลือกหมวด');
    var r = parseAmount(f.amount);
    if (!r.ok) return fail(r.error || 'ยังไม่ได้ใส่จำนวนเงิน');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) return fail('ยังไม่ได้เลือกวันที่');
    return { date:f.date, type:f.type, catId:c.id, amount:r.value, note:f.note.trim(), meals:c.main === 'อาหาร' ? f.meals.slice() : [] };
  }
  /** รายการที่ยังรอส่ง: แก้/ลบในคิวของเครื่องได้เลย (ยกเว้นตอนกำลังส่ง) */
  function pendingEntry(){
    var en = init.pending ? findEntry(init.token) : null;
    if (init.pending && !en){ fail('รายการนี้ส่งเข้าชีตแล้ว ปิดแล้วแตะใหม่จากรายการ'); return null; }
    if (en && en.state === 'sending'){ fail('กำลังส่งรายการนี้อยู่ รอสักครู่แล้วลองใหม่'); return null; }
    return en;
  }
  var lastSaveAt = 0;
  function save(btn){
    fail('');
    var item = collect();
    if (!item){ if (Date.now() - lastSaveAt < 1500) fail(''); return; }   // แตะซ้ำหลังบันทึก (ฟอร์มว่างแล้ว) ไม่ต้องขึ้นข้อความเตือน
    if (init.pending){
      var en = pendingEntry(); if (!en) return;
      en.items[init.idx] = item; en.state = 'wait'; en.err = '';
      saveOutbox(); toast('แก้ไขแล้ว (รอส่ง): ' + catLabel(S.cat[item.catId]) + ' ' + fmtMoney(item.amount));
      opts.onDone && opts.onDone(); rerender(); S.retryDelay = 0; flushOutbox();
      return;
    }
    if (opts.edit){
      f.busy = true; btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
      call('updateTransaction', init.id, item).then(function(x){
        storePut(S.store, x, Date.now()); sumDirty(init.date); sumDirty(x.date);
        toast('แก้ไขแล้ว: ' + catLabel(S.cat[item.catId]) + ' ' + fmtMoney(item.amount));
        f.busy = false;
        opts.onDone && opts.onDone(); rerender();
      }).catch(function(err){
        f.busy = false; btn.disabled = false; btn.textContent = 'บันทึกการแก้ไข';
        fail(err.message + '\n(ข้อมูลยังอยู่ในฟอร์ม กดบันทึกอีกครั้งได้)');
      });
      return;
    }
    // เพิ่มใหม่: ขึ้นในรายการทันที ส่งเข้าชีตเบื้องหลัง
    lastSaveAt = Date.now();
    var token = f.token, wasSalary = S.cat[item.catId].main === 'เงินเดือน';
    f.amount = ''; f.note = ''; f.meals = []; f.token = newToken();
    render();
    if (opts.onDone) opts.onDone(item);
    enqueue('กรอกเอง', [item], token);
    toast('บันทึกแล้ว: ' + catLabel(S.cat[item.catId]) + ' ' + fmtMoney(item.amount));
    if (wasSalary) askNewCycle(item.date);
  }
  function del(btn){
    if (!btn.dataset.sure){ btn.dataset.sure = '1'; btn.textContent = 'แตะอีกครั้งเพื่อยืนยันการลบ'; return; }
    if (init.pending){
      var en = pendingEntry(); if (!en) return;
      en.items.splice(init.idx, 1);
      if (!en.items.length) S.outbox = S.outbox.filter(function(x){ return x !== en; });
      saveOutbox(); toast('ลบรายการที่ยังไม่ได้ส่งแล้ว (ไม่ได้เข้าชีต)');
      opts.onDone && opts.onDone(); rerender();
      return;
    }
    f.busy = true; btn.disabled = true; btn.textContent = 'กำลังลบ…';
    call('deleteTransaction', init.id).then(function(){
      storeDel(S.store, init.id, Date.now()); sumDirty(init.date);
      toast('ลบรายการแล้ว'); f.busy = false; opts.onDone && opts.onDone(); rerender();
    }).catch(function(err){ f.busy = false; btn.disabled = false; btn.textContent = 'ลบรายการนี้'; delete btn.dataset.sure; fail(err.message); });
  }
  f.pristine = function(){ return !f.catId && !f.amount && !f.note && !f.busy; };
  f.redraw = render;
  render();
  return f;
}

/* ---------- ถามเริ่มรอบใหม่ ---------- */
function askNewCycle(date){
  var cur = cycleFor(date, S.boot.cycles, S.boot.today);
  if (cur && cur.start === date) return;
  var sh = openSheet(2, '<h2>เริ่มรอบเงินเดือนใหม่ไหม</h2>' +
    '<p>ให้วันที่ <b>' + thaiDate(date, true) + '</b> เป็นวันเริ่มรอบเงินเดือนใหม่' +
    (cur ? ' (รอบเดิมเริ่ม ' + thaiDate(cur.start) + ' จะปิดในวันก่อนหน้า)' : '') + '</p>' +
    '<div class="err-box" id="cyErr"></div>' +
    '<button class="primary" data-a="yes">เริ่มรอบใหม่</button><button class="ghost" style="width:100%;margin-top:10px" data-a="no">ยังไม่ต้อง</button>');
  sh.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'no') return closeSheet(2);
    b.disabled = true; b.textContent = 'กำลังบันทึก…';
    call('startCycle', date).then(function(cycles){
      S.boot.cycles = cycles; saveLiteBoot(); closeSheet(2); toast('เริ่มรอบใหม่ ' + thaiDate(date) + ' แล้ว');
      if (S.tab === 'list') loadList();
    }).catch(function(err){ b.disabled = false; b.textContent = 'เริ่มรอบใหม่'; $('cyErr').textContent = err.message; });
  };
}

/* ---------- ชุดรายการวันเงินเดือน ---------- */
function openPayday(){
  if (!S.boot.template){ toast('กำลังโหลดชุดรายการจากชีต รอสักครู่แล้วแตะอีกครั้ง'); return; }
  // แถวบนหน้าจอ: on = เดือนนี้มี, removed = เอาออกจากแม่แบบ, isNew/keep = เพิ่มใหม่ (จำในแม่แบบหรือเฉพาะเดือนนี้)
  var rows = S.boot.template.map(function(t){
    return { catId:t.catId, type:t.type, amount:String(t.amount), orig:t.amount, slip:t.slip, detail:t.detail, on:true, removed:false, isNew:false, keep:true };
  });
  var base = S.boot.template.map(function(t){ return { catId:t.catId, amount:t.amount, slip:t.type === 'รายจ่าย' && t.slip }; });
  var date = S.boot.today, token = newToken(), remember = true;
  var sh = openSheet(1, '');
  function inSlip(r){ return r.type === 'รายได้' || r.slip; }
  function sums(){
    var gross = 0, slip = 0, other = 0, bad = false;
    rows.forEach(function(r){
      if (!r.on || r.removed) return;
      var p = parseAmount(r.amount); if (!p.ok){ bad = true; return; }
      if (r.type === 'รายได้') gross += p.cents; else if (r.slip) slip += p.cents; else other += p.cents;
    });
    return {gross:gross/100, slip:slip/100, other:other/100, net:(gross-slip)/100, bad:bad};
  }
  function coopNote(r){
    var c = S.cat[r.catId];
    if (!c || c.main !== 'ค่าผ่อนหนี้สหกรณ์' || !S.boot.coopPrincipal) return '';
    var p = parseAmount(r.amount); if (!p.ok) return '';
    var interest = (p.cents - Math.round(S.boot.coopPrincipal*100))/100;
    return 'ต้น ' + fmtMoney(S.boot.coopPrincipal) + ' · ดอก ' + fmtMoney(interest);
  }
  function name(r){ var c = S.cat[r.catId]; return c ? c.icon + ' ' + catLabel(c) : r.catId; }
  function rowHtml(r, i){
    if (r.removed){
      return '<tr class="gone"><td></td><td><s>' + escapeHtml(name(r)) + '</s><div class="muted" style="font-size:12px">จะเอาออกจากแม่แบบ</div></td>' +
        '<td style="text-align:right"><button class="lnk" data-undo="' + i + '">เลิกทำ</button></td><td></td></tr>';
    }
    return '<tr><td><input type="checkbox" data-i="' + i + '" ' + (r.on ? 'checked' : '') + ' aria-label="เดือนนี้มีรายการนี้"></td>' +
      '<td>' + escapeHtml(name(r)) + '<div class="muted" style="font-size:12px" id="pdNote' + i + '">' + coopNote(r) + '</div>' +
      (r.isNew ? '<button class="tag' + (r.keep ? ' on' : '') + '" data-keep="' + i + '">' + (r.keep ? '📌 จำในแม่แบบด้วย' : 'เฉพาะเดือนนี้') + '</button>' : '') + '</td>' +
      '<td style="text-align:right"><input type="text" class="field" inputmode="decimal" data-amt="' + i + '" value="' + escapeHtml(r.amount) + '"></td>' +
      '<td class="more"><button class="morebtn" data-more="' + i + '" aria-label="ตัวเลือกของ ' + escapeHtml(name(r)) + '">⋯</button></td></tr>';
  }
  function render(){
    var y = sh.scrollTop;
    sh.innerHTML = '<h2>💰 ชุดรายการวันเงินเดือน</h2>' +
      '<div class="dateline"><input type="date" class="field" id="pdDate" value="' + date + '"><span class="be" id="pdBe">' + thaiDate(date, true) + '</span></div>' +
      '<div class="slip"><div class="grp">ตามสลิปเงินเดือน</div><table>' +
        rows.map(function(r,i){ return inSlip(r) ? rowHtml(r,i) : ''; }).join('') + '</table>' +
        '<button class="addrow" data-add="slip">＋ เพิ่มรายการในสลิป</button>' +
      '<div class="card" style="margin-top:8px"><div class="tot"><span>ยอดรวมก่อนหัก</span><b class="inc" id="pdGross"></b></div>' +
        '<div class="tot"><span>รวมหักจากสลิป</span><b class="exp" id="pdSlip"></b></div>' +
        '<div class="tot"><span>เงินได้สุทธิ (เทียบกับยอดเข้าบัญชี)</span><b id="pdNet"></b></div></div>' +
      '<div class="grp">รายการประจำอื่นของวันเงินเดือน</div><table>' +
        rows.map(function(r,i){ return !inSlip(r) ? rowHtml(r,i) : ''; }).join('') + '</table>' +
        '<button class="addrow" data-add="other">＋ เพิ่มรายการประจำ</button></div>' +
      '<div class="tot" style="margin-top:8px"><span>รวมรายการประจำอื่น</span><b id="pdOther"></b></div>' +
      '<p class="muted" style="font-size:13px">แก้จำนวนได้ทุกช่อง (พิมพ์บวก/ลบได้) · ติ๊กออก = เดือนนี้ไม่มี · แตะ ⋯ เพื่อย้ายกลุ่ม เปลี่ยนหมวด หรือเอาออกจากแม่แบบ</p>' +
      '<label class="chk"><input type="checkbox" id="pdRemember"' + (remember ? ' checked' : '') + '><span>จำค่าชุดนี้เป็นแม่แบบรอบหน้า<br><span class="muted" style="font-size:13px;font-weight:400">จำจำนวนเงิน รายการที่เพิ่ม และรายการที่เอาออก รายการที่ติ๊กออกเฉพาะเดือนนี้ยังอยู่ในแม่แบบด้วยจำนวนเดิม</span></span></label>' +
      '<div class="err-box" id="pdErr"></div>' +
      '<button class="primary" id="pdSave">บันทึกทั้งชุด</button>' +
      '<button class="ghost" style="width:100%;margin-top:10px" id="pdTplOnly">จำเป็นแม่แบบอย่างเดียว (ยังไม่บันทึกรายการ)</button>' +
      '<button class="ghost" style="width:100%;margin-top:10px" id="pdClose">ปิด</button>';
    sh.scrollTop = y;
    updateTotals();
  }
  function updateTotals(){
    var s = sums();
    $('pdGross').textContent = fmtMoney(s.gross); $('pdSlip').textContent = fmtMoney(s.slip);
    $('pdNet').textContent = fmtMoney(s.net); $('pdOther').textContent = fmtMoney(s.other);
    $('pdErr').textContent = s.bad ? 'มีช่องจำนวนเงินที่ไม่ถูกต้อง' : '';
    rows.forEach(function(r, i){ var n = $('pdNote' + i); if (n) n.textContent = coopNote(r); });
  }
  function addRow(cat, slip){
    var last = S.boot.lastAmount[cat.id];
    rows.push({ catId:cat.id, type:cat.type, amount:last ? String(last) : '', orig:0, slip:cat.type === 'รายจ่าย' && slip, detail:'', on:true, removed:false, isNew:true, keep:true });
    render();
    var el = sh.querySelector('[data-amt="' + (rows.length - 1) + '"]');
    if (el){ el.scrollIntoView({ block:'center' }); el.focus(); el.select(); }
  }
  function moreMenu(i){
    var r = rows[i];
    var m = openSheet(2, '<h2>' + escapeHtml(name(r)) + '</h2><div class="list">' +
      (r.type === 'รายจ่าย' ? '<button data-m="move">↕️ <span class="grow">ย้ายไปกลุ่ม ' + (r.slip ? '"รายการประจำอื่น"' : '"หักจากสลิป"') + '</span></button>' : '') +
      '<button data-m="cat">🏷️ <span class="grow">เปลี่ยนหมวด</span></button>' +
      (r.isNew ? '<button data-m="drop" class="exp">🗑️ <span class="grow">ลบรายการที่เพิ่งเพิ่ม</span></button>'
               : '<button data-m="remove" class="exp">🗑️ <span class="grow">เอาออกจากแม่แบบถาวร</span></button>') +
      '</div><p class="muted small">' + (r.isNew ? '' : 'ถ้าแค่เดือนนี้ไม่มี ให้ติ๊กช่องหน้ารายการออกแทน รายการจะยังอยู่ในแม่แบบ') + '</p>' +
      '<button class="ghost" style="width:100%;margin-top:6px" data-m="close">ยกเลิก</button>');
    m.onclick = function(e){
      var b = e.target.closest('[data-m]'); if (!b) return;
      var a = b.dataset.m;
      closeSheet(2);
      if (a === 'move'){ r.slip = !r.slip; render(); }
      if (a === 'remove'){ r.removed = true; render(); }
      if (a === 'drop'){ rows.splice(i, 1); render(); }
      if (a === 'cat') pickCategory(r.type, function(c){ r.catId = c.id; r.type = c.type; if (c.type === 'รายได้') r.slip = false; render(); });
    };
  }
  sh.oninput = function(e){
    var t = e.target;
    if (t.dataset.amt != null){ rows[t.dataset.amt].amount = t.value; updateTotals(); }
    if (t.id === 'pdDate'){ date = t.value; $('pdBe').textContent = date ? thaiDate(date, true) : ''; }
  };
  sh.onchange = function(e){
    var t = e.target;
    if (t.dataset.i != null){ rows[t.dataset.i].on = t.checked; updateTotals(); }
    if (t.id === 'pdRemember') remember = t.checked;
  };
  /** แม่แบบใหม่ (ถ้าเปลี่ยนจากเดิม) หรือ {error} */
  function newTemplate(){
    var t = templateFromRows(rows);
    if (t.error) return { error:'จำนวนเงินของ ' + catLabel(S.cat[t.error]) + ' ไม่ถูกต้อง (ต้องใส่ก่อนจำเป็นแม่แบบ)' };
    if (!t.rows.length) return { error:'แม่แบบต้องมีอย่างน้อย 1 รายการ' };
    if (sameTemplate(t.rows, base)) return { same:true };
    return { rows:t.rows };
  }
  sh.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'pdClose') return closeSheet(1);
    if (b.dataset.undo != null){ rows[b.dataset.undo].removed = false; return render(); }
    if (b.dataset.keep != null){ var k = rows[b.dataset.keep]; k.keep = !k.keep; return render(); }
    if (b.dataset.more != null) return moreMenu(Number(b.dataset.more));
    if (b.dataset.add === 'other') return pickCategory('รายจ่าย', function(c){ addRow(c, false); });
    if (b.dataset.add === 'slip'){
      var ch = openSheet(2, '<h2>เพิ่มรายการในสลิป</h2><div class="list">' +
        '<button data-t="รายจ่าย">➖ <span class="grow">รายการหักจากสลิป <span class="muted">(รายจ่าย)</span></span></button>' +
        '<button data-t="รายได้">➕ <span class="grow">รายได้เพิ่มในสลิป <span class="muted">(เช่น ค่าตอบแทนพิเศษ)</span></span></button></div>' +
        '<button class="ghost" style="width:100%;margin-top:10px" data-t="">ยกเลิก</button>');
      ch.onclick = function(ev){
        var x = ev.target.closest('[data-t]'); if (!x) return;
        closeSheet(2);
        if (x.dataset.t) pickCategory(x.dataset.t, function(c){ addRow(c, true); });
      };
      return;
    }
    if (b.id === 'pdTplOnly'){
      var tp = newTemplate();
      if (tp.error){ $('pdErr').textContent = tp.error; return; }
      if (tp.same){ $('pdErr').textContent = 'แม่แบบไม่มีอะไรเปลี่ยน'; return; }
      closeSheet(1);
      enqueueTemplate(tp.rows);
      toast('จำแม่แบบใหม่แล้ว (' + tp.rows.length + ' รายการ) ยังไม่ได้บันทึกรายการเงิน');
      return;
    }
    if (b.id !== 'pdSave') return;
    var items = [], err = '';
    rows.forEach(function(r){
      if (!r.on || r.removed || err) return;
      var p = parseAmount(r.amount);
      if (!p.ok){ err = 'จำนวนเงินของ ' + catLabel(S.cat[r.catId]) + ': ' + (p.error || 'ว่าง'); return; }
      items.push({date:date, type:r.type, catId:r.catId, amount:p.value, note:'', meals:[]});
    });
    if (!err && !/^\d{4}-\d{2}-\d{2}$/.test(date)) err = 'ยังไม่ได้เลือกวันที่';
    if (!err && !items.length) err = 'ไม่มีรายการที่เลือก';
    var tpl = remember && !err ? newTemplate() : {};
    if (!err && tpl.error) err = tpl.error;
    if (err){ $('pdErr').textContent = err; return; }
    closeSheet(1);
    dayDate = date;
    enqueue('ชุดเงินเดือน', items, token);
    if (tpl.rows) enqueueTemplate(tpl.rows);
    toast('บันทึกชุดวันเงินเดือนแล้ว ' + items.length + ' รายการ' + (tpl.rows ? ' · จำแม่แบบใหม่แล้ว' : ''));
    if (items.some(function(it){ return S.cat[it.catId].main === 'เงินเดือน'; })) askNewCycle(date);
  };
  render();
}

/* ---------- แสดงรายการ ---------- */
function txRowHtml(x){
  var c = S.cat[x.catId];
  var meals = (x.meals || []).map(function(m){ for (var i=0;i<MEAL_LIST.length;i++) if (MEAL_LIST[i][0] === m) return MEAL_LIST[i][1]; return ''; }).join('');
  var sub = [c && c.sub !== c.main ? c.main : '', meals, x.note].filter(Boolean).join(' · ');
  if (x.pending) sub = (x.state === 'failed' ? 'ส่งไม่สำเร็จ แตะเพื่อแก้' : x.state === 'sending' ? 'กำลังส่ง…' : 'รอส่ง') + (sub ? ' · ' + sub : '');
  var cls = 'tx' + (x.pending ? ' pending' + (x.state === 'failed' ? ' failed' : '') : '');
  return '<button class="' + cls + '" data-tx="' + escapeHtml(x.id) + '"><span class="ic">' + escapeHtml(c ? c.icon : '❔') + '</span>' +
    '<span class="grow"><div class="t1">' + escapeHtml(catLabel(c)) + '</div>' + (sub ? '<div class="t2">' + escapeHtml(sub) + '</div>' : '') + '</span>' +
    '<span class="amt ' + (x.type === 'รายได้' ? 'inc' : 'exp') + '">' + (x.type === 'รายได้' ? '+' : '−') + fmtMoney(x.amount) + '</span></button>';
}

function openEdit(x, after){
  var head = x.pending
    ? '<h2>แก้ไขรายการที่ยังไม่ได้ส่ง</h2><p class="muted small">' + (x.state === 'failed'
        ? '<span class="exp">ส่งไม่สำเร็จ: ' + escapeHtml(x.err) + '</span><br>แก้ให้ถูกแล้วกดบันทึก แอปจะส่งใหม่ให้'
        : 'รายการนี้อยู่ในเครื่องรอส่งเข้าชีต แก้หรือลบได้ก่อนส่ง') + '</p>'
    : '<h2>แก้ไขรายการ</h2>';
  openSheet(1, head + '<div class="card" id="editBox"></div>');
  makeForm($('editBox'), x, {edit:true, prefix:'e_', onDone:function(){ closeSheet(1); after && after(); }, onClose:function(){ closeSheet(1); }});
}

var dayDate = null, dayShown = [];
function refreshDay(){
  if (!S.boot) return;
  var d = dayDate || S.boot.today;
  $('dayTitle').textContent = d === S.boot.today ? 'วันนี้ · ' + thaiDate(d) : thaiDate(d, true);
  viewRange(d, d, function(list){
    if ((dayDate || S.boot.today) !== d) return;
    if (!list){ $('daySum').textContent = ''; $('dayList').innerHTML = skeletonHtml(2); return; }
    dayShown = list;
    var t = totals(list, S.cat);
    $('daySum').innerHTML = (t.inc ? '<span class="inc">+' + fmtMoney(t.inc) + '</span> ' : '') + '<span class="exp">−' + fmtMoney(t.exp) + '</span>';
    $('dayList').innerHTML = list.length ? list.map(txRowHtml).join('') : '<div class="empty">ยังไม่มีรายการ</div>';
  }, function(err){
    if ((dayDate || S.boot.today) !== d) return;
    $('dayList').innerHTML = '<div class="err-box">' + escapeHtml(err.message) + '</div><button class="ghost" style="margin-top:8px" data-retry="day">ลองใหม่</button>';
  });
}
$('dayList').addEventListener('click', function(e){
  if (e.target.closest('[data-retry]')) return refreshDay();
  var b = e.target.closest('[data-tx]'); if (!b) return;
  var x = dayShown.filter(function(t){ return t.id === b.dataset.tx; })[0];
  if (x) openEdit(x);
});

/* ---------- หน้ารายการ ---------- */
var MODES = [['cycle','รอบเงินเดือน'],['month','เดือน'],['day','วัน'],['year','ปี'],['custom','กำหนดเอง']];
function renderModes(){
  $('modeChips').innerHTML = MODES.map(function(m){ return '<button class="chip' + (S.listMode === m[0] ? ' on' : '') + '" data-mode="' + m[0] + '">' + m[1] + '</button>'; }).join('');
}
$('modeChips').addEventListener('click', function(e){
  var b = e.target.closest('[data-mode]'); if (!b) return;
  S.listMode = b.dataset.mode;
  if (S.listMode === 'custom' && !S.custom) S.custom = {start:monthStart(S.anchor), end:S.anchor};
  renderModes(); loadList();
});
$('prev').onclick = function(){ S.anchor = shiftAnchor(S.listMode, S.anchor, -1, S.boot.cycles, S.boot.today); loadList(); };
$('next').onclick = function(){ S.anchor = shiftAnchor(S.listMode, S.anchor, 1, S.boot.cycles, S.boot.today); loadList(); };
$('btnToday').onclick = function(){ S.anchor = S.boot.today; if (S.listMode === 'custom') S.custom = {start:S.boot.today, end:S.boot.today}; loadList(); };
$('cStart').onchange = $('cEnd').onchange = function(){
  if ($('cStart').value && $('cEnd').value){ S.custom = {start:$('cStart').value, end:$('cEnd').value}; loadList(); }
};

var listSeq = 0;
function loadList(){
  var r = periodRange(S.listMode, S.anchor, S.boot.cycles, S.boot.today, S.custom || {start:S.anchor, end:S.anchor});
  $('periodLbl').textContent = r.label;
  var custom = S.listMode === 'custom';
  $('customBox').hidden = !custom; $('prev').disabled = custom;
  $('next').disabled = custom || (S.listMode === 'cycle' && r.open) || r.end >= S.boot.today && S.listMode !== 'year' && S.listMode !== 'month' && S.listMode !== 'cycle';
  if (custom){ $('cStart').value = r.start; $('cEnd').value = r.end; }
  var seq = ++listSeq;
  viewRange(r.start, r.end, function(list){
    if (seq !== listSeq) return;
    if (!list){
      $('sumBox').innerHTML = '<div><small>รายได้</small><b>…</b></div><div><small>รายจ่าย</small><b>…</b></div><div><small>คงเหลือ</small><b>…</b></div>';
      $('splitBox').textContent = '';
      $('txList').innerHTML = '<div class="card" style="padding:4px 10px">' + skeletonHtml(5) + '</div>';
      return;
    }
    var t = totals(list, S.cat);
    $('sumBox').innerHTML = '<div><small>รายได้</small><b class="inc">' + fmtMoney(t.inc) + '</b></div>' +
      '<div><small>รายจ่าย</small><b class="exp">' + fmtMoney(t.exp) + '</b></div>' +
      '<div><small>คงเหลือ</small><b>' + fmtMoney(t.inc - t.exp) + '</b></div>';
    $('splitBox').textContent = 'ใช้จ่ายจริง ' + fmtMoney(t.spend) + ' · ออม/ลงทุน ' + fmtMoney(t.save) + ' · ผ่อนหนี้ ' + fmtMoney(t.debt) +
      (t.share ? ' · เพื่อนหารค่าบริการ ' + fmtMoney(t.share) : '');
    var days = groupByDay(list);
    $('txList').innerHTML = days.length ? days.map(function(d){
      return '<div class="daybar"><div>' + thaiDate(d.date, true) + '</div><span>' +
        (d.inc ? '<span class="inc">+' + fmtMoney(d.inc) + '</span> ' : '') + (d.exp ? '<span class="exp">−' + fmtMoney(d.exp) + '</span>' : '') + '</span></div>' +
        '<div class="card" style="padding:4px 10px">' + d.items.map(txRowHtml).join('') + '</div>';
    }).join('') : '<div class="empty">ไม่มีรายการในช่วงนี้</div>';
    S.lastList = list;
    // เดาว่าจะกดดูช่วงก่อนหน้าต่อ โหลดรอไว้เงียบ ๆ
    if (S.listMode !== 'custom' && S.listMode !== 'year'){
      var pr = periodRange(S.listMode, shiftAnchor(S.listMode, S.anchor, -1, S.boot.cycles, S.boot.today), S.boot.cycles, S.boot.today, null);
      setTimeout(function(){ prefetch(pr.start, pr.end); }, 300);
    }
  }, function(err){
    if (seq === listSeq) $('txList').innerHTML = '<div class="err-box">' + escapeHtml(err.message) + '</div><button class="ghost" style="margin-top:8px" data-retry="list">ลองใหม่</button>';
  });
}
$('txList').addEventListener('click', function(e){
  if (e.target.closest('[data-retry]')) return loadList();
  var b = e.target.closest('[data-tx]'); if (!b) return;
  var x = (S.lastList || []).filter(function(t){ return t.id === b.dataset.tx; })[0];
  if (x) openEdit(x);
});

/* ---------- หน้าภาพรวม (เฟส 3) ----------
   ช่วงที่เลือกและช่วงก่อนหน้า: ใช้รายการเต็มจากที่จำไว้ในหน่วยความจำ (ชุดเดียวกับหน้ารายการ รวมรายการที่รอส่ง)
   กราฟแนวโน้ม 12 ช่วง: ขอยอดรวมรายหมวดจากชีตครั้งเดียว (summarize) ไม่ดึงรายการทีละแถว */
var SUM_TTL = 10 * 60000;
var GROUP_COLOR = { 'ใช้จ่ายจริง':'var(--s1)', 'ออมและลงทุน':'var(--s2)', 'ผ่อนหนี้':'var(--s3)' };

/** รายการของวันนี้ถูกเพิ่ม/แก้/ลบ: ยอดรวมจากชีตที่จำไว้ของช่วงที่ครอบวันนั้นใช้ไม่ได้แล้ว */
function sumDirty(date){
  if (!date) return;
  Object.keys(S.sumCache).forEach(function(k){ var p = k.split('|'); if (date >= p[0] && date <= p[1]) delete S.sumCache[k]; });
}
function isSpend(x){ return x.type === 'รายจ่าย' && sum3Of(S.cat[x.catId]) === 'ใช้จ่ายจริง'; }
function ovWord(){ return S.ovMode === 'month' ? 'เดือน' : 'รอบ'; }

function ovRanges(){
  var cy = S.boot.cycles, td = S.boot.today;
  var r = periodRange(S.ovMode, S.ovAnchor, cy, td, null);
  var pr = periodRange(S.ovMode, shiftAnchor(S.ovMode, r.start, -1, cy, td), cy, td, null);
  if (pr.start === r.start || (S.ovMode === 'cycle' && pr.noCycle)) pr = null;
  return { r:r, pr:pr };
}

var ovSeq = 0;
function loadOverview(){
  if (!S.boot) return;
  var rr = ovRanges(), r = rr.r, pr = rr.pr, seq = ++ovSeq;
  document.querySelectorAll('#ovMode button').forEach(function(b){ b.classList.toggle('on', b.dataset.m === S.ovMode); });
  $('ovLbl').textContent = r.label;
  $('ovNext').disabled = r.end >= S.boot.today;
  $('ovPrev').disabled = !pr;
  var key = S.ovMode + '|' + r.start + '|' + r.end;
  var st = { key:key, r:r, pr:pr, cur:undefined, prev:pr ? undefined : null, err:null };
  if (S.ovState && S.ovState.key === key){ st.cur = S.ovState.cur; st.prev = pr ? S.ovState.prev : null; }  // ของเดิมแสดงไปก่อน
  function draw(){ if (seq === ovSeq){ S.ovState = st; renderOverview(st); } }
  viewRange(r.start, r.end, function(list){ if (list) st.cur = list; draw(); }, function(err){ st.err = err; draw(); });
  if (pr) viewRange(pr.start, pr.end, function(list){ if (list) st.prev = list; draw(); }, function(){ st.prev = null; draw(); });
  loadTrend();
  if (pr){   // เดาว่าจะกดย้อนต่อ โหลดช่วงก่อนหน้าอีกช่วงรอไว้
    var pp = periodRange(S.ovMode, shiftAnchor(S.ovMode, pr.start, -1, S.boot.cycles, S.boot.today), S.boot.cycles, S.boot.today, null);
    if (!pp.noCycle && pp.start !== pr.start) setTimeout(function(){ prefetch(pp.start, pp.end); }, 500);
  }
}

function kpiHtml(label, val, d, cmpWord, opt){
  opt = opt || {};
  var dd = '';
  if (d === undefined) dd = '<span class="sk" style="border:0;padding:0;display:block"><i style="width:70%;height:10px"></i></span>';
  else if (d) dd = d.dir === 0 ? 'เท่ากับ' + cmpWord : (d.dir > 0 ? '▲ มากกว่า' : '▼ น้อยกว่า') + cmpWord + ' ' + fmtMoney(d.diff) + (d.pct != null && d.pct < 1000 ? ' (' + d.pct + '%)' : '');
  return '<div class="kpi' + (opt.wide ? ' wide' : '') + '"><small>' + (opt.color ? '<i class="key" style="background:' + opt.color + '"></i>' : '') + escapeHtml(label) + '</small>' +
    '<b' + (opt.cls ? ' class="' + opt.cls + '"' : '') + '>' + fmtMoney(val) + '</b><div class="d">' + dd + (opt.extra ? '<br>' + opt.extra : '') + '</div></div>';
}

function renderOverview(st){
  var body = $('ovBody');
  var open = st.r.end >= S.boot.today;
  var upto = open ? S.boot.today : st.r.end;
  var days = daysIn(st.r.start, upto);
  $('ovSub').textContent = open ? 'ถึงวันนี้ · วันที่ ' + days + ' ของ' + ovWord() + (S.ovMode === 'month' ? ' (' + daysIn(st.r.start, st.r.end) + ' วัน)' : '')
                                : ovWord() + 'นี้มี ' + days + ' วัน';
  if (st.cur === undefined){
    if (st.err){
      body.className = '';
      body.innerHTML = '<div class="card"><div class="err-box">' + escapeHtml(st.err.message) + '</div><button class="ghost" style="margin-top:8px" data-retry="ov">ลองใหม่</button></div>';
    } else if (body.dataset.key !== st.key){
      body.className = ''; body.dataset.key = '';
      body.innerHTML = '<div class="kpis">' + [1,2,3,4].map(function(){ return '<div class="kpi">' + skeletonHtml(1) + '</div>'; }).join('') + '</div><div class="card">' + skeletonHtml(4) + '</div>';
    } else body.className = 'dim';   // ของเดิมจางไว้ระหว่างรอ ไม่กระพริบ
    return;
  }
  body.className = ''; body.dataset.key = st.key;
  var f = figures(aggregate(st.cur), S.cat);
  // เทียบช่วงก่อนหน้า: ช่วงที่ยังไม่จบเทียบเฉพาะจำนวนวันเท่ากัน
  var pf, cmpWord = ovWord() + 'ก่อน', prevUpto = null;
  if (st.pr && st.prev){
    prevUpto = open ? addDays(st.pr.start, days - 1) : st.pr.end;
    if (prevUpto > st.pr.end) prevUpto = st.pr.end;
    pf = figures(aggregate(st.prev.filter(function(x){ return x.date <= prevUpto; })), S.cat);
  }
  function d(k){ return st.pr ? (st.prev === undefined ? undefined : pf ? delta(f[k], pf[k]) : null) : null; }
  var cmpNote = st.pr ? (open ? 'เทียบ' + cmpWord + 'ช่วงเดียวกัน (' + days + ' วันแรก ถึง ' + thaiDate(prevUpto || st.pr.end) + ')' : 'เทียบ' + cmpWord + 'ทั้ง' + ovWord() + ' (' + st.pr.label.replace(/^รอบ /, '') + ')') : 'ไม่มี' + cmpWord + 'ให้เทียบ';

  var h = '<div class="card" data-health></div><div class="kpis">' +
    kpiHtml('รายได้จริง', f.realInc, d('realInc'), cmpWord, { cls:'inc', extra:(f.share || f.loan) ? 'รับทั้งหมด ' + fmtMoney(f.inc) + ' (รวม' + [f.share ? 'เงินที่เพื่อนหาร ' + fmtMoney(f.share) : '', f.loan ? 'เงินยืม ' + fmtMoney(f.loan) : ''].filter(Boolean).join(', ') + ')' : '' }) +
    kpiHtml('ใช้จ่ายจริง', f.spend, d('spend'), cmpWord, { color:GROUP_COLOR['ใช้จ่ายจริง'], extra:f.share ? 'หักเงินที่เพื่อนหารแล้ว ' + fmtMoney(f.spendNet) : '' }) +
    kpiHtml('ออมและลงทุน', f.save, d('save'), cmpWord, { color:GROUP_COLOR['ออมและลงทุน'] }) +
    kpiHtml('ผ่อนหนี้', f.debt, d('debt'), cmpWord, { color:GROUP_COLOR['ผ่อนหนี้'] }) +
    kpiHtml('คงเหลือ (รับทั้งหมด − จ่ายทั้งหมด)', f.net, d('net'), cmpWord, { wide:true, cls:f.net < 0 ? 'exp' : '', extra:'รับ ' + fmtMoney(f.inc) + ' · จ่าย ' + fmtMoney(f.exp) }) +
    '</div><p class="note" style="margin:-4px 2px 12px">' + escapeHtml(cmpNote) + '</p>';

  // รายจ่ายแยก 3 ทาง (แท่งแบ่งส่วน)
  var tree = expenseTree(aggregate(st.cur), S.cat), expC = Math.round(f.exp * 100);
  if (expC > 0){
    h += '<div class="card"><div class="ctitle"><b>รายจ่ายทั้งหมด ' + fmtMoney(f.exp) + '</b><span>แยก 3 ทาง</span></div><div class="mix" role="img" aria-label="สัดส่วนรายจ่าย">' +
      tree.filter(function(g){ return g.cents > 0; }).map(function(g){ return '<i style="flex:' + g.cents + ';background:' + GROUP_COLOR[g.name] + '"></i>'; }).join('') + '</div>' +
      '<div class="legend">' + tree.map(function(g){ return '<span><i class="sw" style="background:' + GROUP_COLOR[g.name] + '"></i>' + escapeHtml(g.name) + ' <b>' + fmtMoney(g.cents / 100) + '</b> · ' + Math.round(g.cents / expC * 100) + '%</span>'; }).join('') + '</div></div>';
    // รายจ่ายตามหมวด (แท่งเรียงจากมากไปน้อย แตะเพื่อดูหมวดย่อยและรายการ)
    var maxMain = 0;
    tree.forEach(function(g){ g.mains.forEach(function(m){ if (m.cents > maxMain) maxMain = m.cents; }); });
    h += '<div class="card"><div class="ctitle"><b>รายจ่ายตามหมวด</b><span>แตะเพื่อดูหมวดย่อยและรายการ</span></div>';
    tree.forEach(function(g){
      if (!g.cents) return;
      h += '<div class="cgrp"><span><i class="key" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:' + GROUP_COLOR[g.name] + '"></i>' + escapeHtml(g.name) + '</span><span>' + fmtMoney(g.cents / 100) + '</span></div>';
      g.mains.forEach(function(m){
        var single = m.subs.length === 1, isOpen = !single && S.ovOpen[m.key];
        h += '<button class="bar" ' + (single ? 'data-cat="' + escapeHtml(m.subs[0].catId) + '"' : 'data-main="' + escapeHtml(m.key) + '"') + '>' +
          '<div class="top"><span class="chev">' + (single ? '' : isOpen ? '▾' : '▸') + '</span><span class="nm">' + escapeHtml(m.icon + ' ' + m.main) + '</span><span class="v">' + fmtMoney(m.cents / 100) + '</span><span class="p">' + Math.round(m.cents / expC * 100) + '%</span></div>' +
          '<div class="track" style="width:' + Math.max(1, m.cents / maxMain * 100).toFixed(1) + '%;background:' + GROUP_COLOR[g.name] + '"></div></button>';
        if (isOpen) m.subs.forEach(function(s){
          h += '<button class="bar sub" data-cat="' + escapeHtml(s.catId) + '"><div class="top"><span class="nm">' + escapeHtml(s.name) + '</span><span class="v">' + fmtMoney(s.cents / 100) + '</span><span class="p">' + Math.round(s.cents / expC * 100) + '%</span></div>' +
            '<div class="track" style="width:' + Math.max(1, s.cents / maxMain * 100).toFixed(1) + '%;background:' + GROUP_COLOR[g.name] + '"></div></button>';
        });
      });
    });
    h += '</div>';
  } else {
    h += '<div class="card"><div class="empty">ยังไม่มีรายจ่ายใน' + ovWord() + 'นี้</div></div>';
  }

  // ใช้จ่ายจริงสะสมรายวัน เทียบช่วงก่อน
  h += '<div class="card" id="ovDaily"><div class="ctitle"><b>ใช้จ่ายจริงสะสมรายวัน</b><span>เทียบ' + cmpWord + '</span></div><div class="chart"></div><div class="legend" id="ovDailyLg"></div><p class="note" id="ovDailyNote"></p><div id="ovDailyTbl"></div></div>';
  // แนวโน้ม
  h += '<div class="card" id="ovTrend"></div>';
  body.innerHTML = h;
  drawHealthCards();
  drawDaily(st, upto);
  drawTrend();
}

/* ---------- กราฟเส้น: ใช้จ่ายจริงสะสม ---------- */
function drawDaily(st, upto){
  var box = $('ovDaily'); if (!box) return;
  var cur = cumulative(st.cur, st.r.start, upto, isSpend);
  var prev = st.pr && st.prev ? cumulative(st.prev, st.pr.start, st.pr.end, isSpend) : null;
  var series = [{ name:ovWord() + 'นี้', color:'var(--s1)', values:cur, dates:function(i){ return addDays(st.r.start, i); } }];
  if (prev) series.push({ name:ovWord() + 'ก่อน', color:'var(--cmp)', values:prev, dates:function(i){ return addDays(st.pr.start, i); } });
  var chart = box.querySelector('.chart');
  if (!cur.length){ chart.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }
  lineChart(chart, series.slice().reverse());   // วาดเส้นเทียบก่อน เส้นหลักอยู่บนสุด
  $('ovDailyLg').innerHTML = series.map(function(s){ return '<span><i class="ln" style="border-color:' + s.color + '"></i>' + escapeHtml(s.name) + ' ' + fmtMoney(s.values[s.values.length - 1] || 0) + '</span>'; }).join('');
  var avg = function(v){ return v.length ? fmtMoney(Math.round((v[v.length - 1] || 0) / v.length)) : '0'; };
  $('ovDailyNote').textContent = 'เฉลี่ยวันละ ' + avg(cur) + (prev ? ' · ' + ovWord() + 'ก่อนเฉลี่ยวันละ ' + avg(prev) : '') + ' (นับเฉพาะใช้จ่ายจริง ไม่รวมออม/ลงทุนและผ่อนหนี้)';
  var rows = '';
  for (var i = 0; i < Math.max(cur.length, prev ? prev.length : 0); i++){
    rows += '<tr><td>วันที่ ' + (i + 1) + '</td><td>' + (i < cur.length ? fmtMoney(cur[i] - (i ? cur[i - 1] : 0)) + ' / ' + fmtMoney(cur[i]) : '–') + '</td>' +
      (prev ? '<td>' + (i < prev.length ? fmtMoney(prev[i]) : '–') + '</td>' : '') + '</tr>';
  }
  $('ovDailyTbl').innerHTML = tableBox('daily', '<tr><th>วันของ' + ovWord() + '</th><th>' + ovWord() + 'นี้ (วันนั้น / สะสม)</th>' + (prev ? '<th>' + ovWord() + 'ก่อนสะสม</th>' : '') + '</tr>' + rows);
}

function tableBox(id, rowsHtml){
  return '<details class="tbl" data-det="' + id + '"' + (S.ovDetails[id] ? ' open' : '') + '><summary>ดูเป็นตาราง</summary><table>' + rowsHtml + '</table></details>';
}

/** กราฟเส้นแกนเดียว: แกน x = วันที่ 1..N ของช่วง, แตะ/ลากเพื่อดูค่าทุกเส้นของวันนั้น */
function lineChart(el, series){
  var W = 340, H = 176, L = 40, R = 12, T = 10, B = 24;
  var n = 1, max = 0;
  series.forEach(function(s){ n = Math.max(n, s.values.length); s.values.forEach(function(v){ if (v > max) max = v; }); });
  var ticks = niceTicks(max, 4), top = ticks[ticks.length - 1] || 1;
  function x(i){ return L + (n > 1 ? i * (W - L - R) / (n - 1) : (W - L - R) / 2); }
  function y(v){ return T + (H - T - B) * (1 - v / top); }
  var g = '';
  ticks.forEach(function(t){ g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end">' + shortMoney(t) + '</text>'; });
  var xt = [0]; for (var k = 7; k < n - 3; k += 7) xt.push(k); if (n > 1) xt.push(n - 1);
  xt.forEach(function(i){ g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + (i + 1) + '</text>'; });
  series.forEach(function(s, si){
    if (!s.values.length) return;
    var pts = s.values.map(function(v, i){ return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
    g += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if (si === series.length - 1){   // จุดปลายของเส้นหลัก + ป้ายค่า
      var li = s.values.length - 1, lx = x(li), ly = y(s.values[li]);
      g += '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="4" fill="' + s.color + '" stroke="var(--card)" stroke-width="2"/>';
      g += '<text x="' + Math.min(lx, W - R - 2).toFixed(1) + '" y="' + Math.max(ly - 9, 10).toFixed(1) + '" text-anchor="' + (lx > W - 70 ? 'end' : 'middle') + '" style="fill:var(--ink);font-weight:700">' + shortMoney(s.values[li]) + '</text>';
    }
  });
  g += '<line class="xh" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>';
  g += '<rect x="' + L + '" y="0" width="' + (W - L - R) + '" height="' + (H - B) + '" fill="transparent" class="hit"/>';
  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="กราฟใช้จ่ายสะสมรายวัน">' + g + '</svg><div class="tip" hidden></div>';
  var svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh');
  function at(ev){
    var r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
    var i = Math.max(0, Math.min(n - 1, Math.round((sx - L) / ((W - L - R) / Math.max(1, n - 1)))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    var html = '<div class="h">วันที่ ' + (i + 1) + ' ของ' + ovWord() + '</div>';
    series.slice().reverse().forEach(function(s){
      if (i >= s.values.length) return;
      html += '<div class="r"><i style="border-color:' + s.color + '"></i>' + escapeHtml(s.name) + ' · ' + escapeHtml(thaiDate(s.dates(i))) + '<b>' + fmtMoney(s.values[i]) + '</b></div>';
    });
    tip.innerHTML = html; tip.hidden = false;
    var px = x(i) / W * r.width;
    tip.style.top = '0px';
    tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, px - tip.offsetWidth / 2)) + 'px';
  }
  svg.addEventListener('pointerdown', at);
  svg.addEventListener('pointermove', function(ev){ if (ev.pointerType === 'mouse' || ev.buttons) at(ev); });
  svg.addEventListener('pointerleave', function(ev){ if (ev.pointerType === 'mouse'){ tip.hidden = true; xh.setAttribute('visibility', 'hidden'); } });
}

/* ---------- กราฟแท่ง: แนวโน้มย้อนหลัง ---------- */
function trendData(){
  var periods = trendPeriods(S.ovMode, S.ovAnchor, S.boot.cycles, S.boot.today, 12);
  return periods.map(function(p){
    var s = p.start, e = p.end;
    if (storeCovered(S.store, s, e)) return { p:p, agg:aggregate(localRange(s, e)) };
    var c = S.sumCache[s + '|' + e];
    if (c) return { p:p, agg:aggMerge(c.cats, aggregate(outboxItems(S.outbox, s, e))), stale:Date.now() - c.at > SUM_TTL };
    return { p:p, agg:null };
  });
}
function loadTrend(){
  var data = trendData();
  drawTrend(data);
  var need = data.filter(function(d){ return !d.agg || d.stale; }).map(function(d){ return [d.p.start, d.p.end]; });
  if (!need.length) return;
  if (S.trendErr && Date.now() - S.trendErr.at < 30000) return;   // เพิ่งไม่สำเร็จ ไม่ต้องขอถี่
  var k = JSON.stringify(need);
  if (S.sumInflight === k) return;
  S.sumInflight = k;
  var at = Date.now();
  call('summarize', need).then(function(res){
    if (S.sumInflight === k) S.sumInflight = null;
    S.trendErr = null;
    res.forEach(function(r){ S.sumCache[r.start + '|' + r.end] = { at:at, cats:r.cats }; });
    if (S.tab === 'over') drawTrend();
    drawHealthCards();
  }, function(err){
    if (S.sumInflight === k) S.sumInflight = null;
    setTimeout(drawHealthCards, 0);
    S.trendErr = { at:Date.now(), message:err.code === 'BAD_ACTION' ? 'กราฟนี้ต้องใช้ Code.gs เวอร์ชัน 4.0.0 (อัปเดต Apps Script แล้ว Deploy เป็น New version)' : err.message };
    if (S.tab === 'over') drawTrend();
  });
}
function drawTrend(data){
  var box = $('ovTrend'); if (!box || !S.boot) return;
  data = data || trendData();
  var title = '<div class="ctitle"><b>ย้อนหลัง ' + data.length + ' ' + ovWord() + '</b><span>รายจ่ายแยก 3 ทาง เทียบรายได้จริง</span></div>';
  if (data.some(function(d){ return !d.agg; })){
    box.innerHTML = title + (S.trendErr ? '<div class="err-box">' + escapeHtml(S.trendErr.message) + '</div><button class="ghost" style="margin-top:8px" data-retry="trend">ลองใหม่</button>' : skeletonHtml(3));
    return;
  }
  var cols = data.map(function(d){
    var f = figures(d.agg, S.cat);
    return { p:d.p, f:f, open:d.p.end >= S.boot.today, sel:d.p.start <= S.ovAnchor && S.ovAnchor <= d.p.end };
  });
  var W = 340, H = 190, L = 40, R = 6, T = 12, B = 26, n = cols.length;
  var max = 0;
  cols.forEach(function(c){ max = Math.max(max, c.f.exp, c.f.realInc); });
  var ticks = niceTicks(max, 4), top = ticks[ticks.length - 1] || 1;
  function y(v){ return T + (H - T - B) * (1 - v / top); }
  var band = (W - L - R) / n, bw = Math.min(24, band * 0.62);
  var g = '';
  ticks.forEach(function(t){ g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '" stroke="var(--grid)"/><text x="' + (L - 6) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end">' + shortMoney(t) + '</text>'; });
  cols.forEach(function(c, i){
    var cx = L + band * i + band / 2, x0 = cx - bw / 2, base = 0;
    var parts = [['ใช้จ่ายจริง', c.f.spend], ['ออมและลงทุน', c.f.save], ['ผ่อนหนี้', c.f.debt]].filter(function(p){ return p[1] > 0; });
    g += '<g' + (c.open ? ' opacity=".6"' : '') + '>';
    parts.forEach(function(p, pi){
      var y1 = y(base + p[1]), y0 = y(base), last = pi === parts.length - 1;
      var hgt = Math.max(0, y0 - y1 - (pi ? 2 : 0));   // ช่องว่าง 2px ระหว่างส่วน
      var yy = y1;
      if (last && hgt > 4){
        var r = 4;
        g += '<path d="M' + x0.toFixed(1) + ',' + (yy + hgt).toFixed(1) + 'V' + (yy + r).toFixed(1) + 'Q' + x0.toFixed(1) + ',' + yy.toFixed(1) + ' ' + (x0 + r).toFixed(1) + ',' + yy.toFixed(1) +
          'H' + (x0 + bw - r).toFixed(1) + 'Q' + (x0 + bw).toFixed(1) + ',' + yy.toFixed(1) + ' ' + (x0 + bw).toFixed(1) + ',' + (yy + r).toFixed(1) + 'V' + (yy + hgt).toFixed(1) + 'Z" fill="' + GROUP_COLOR[p[0]] + '"/>';
      } else if (hgt > 0){
        g += '<rect x="' + x0.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hgt.toFixed(1) + '" fill="' + GROUP_COLOR[p[0]] + '"/>';
      }
      base += p[1];
    });
    g += '</g>';
    if (c.f.realInc > 0){
      var iy = y(c.f.realInc);
      g += '<line x1="' + (x0 - 4).toFixed(1) + '" x2="' + (x0 + bw + 4).toFixed(1) + '" y1="' + iy.toFixed(1) + '" y2="' + iy.toFixed(1) + '" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>';
    }
    if (n <= 6 || i % 2 === (n - 1) % 2) g += '<text x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle"' + (c.sel ? ' style="fill:var(--ink);font-weight:700"' : '') + '>' + escapeHtml(shortLabel(S.ovMode, c.p)) + '</text>';
    g += '<rect x="' + (L + band * i).toFixed(1) + '" y="0" width="' + band.toFixed(1) + '" height="' + (H - B + 4) + '" fill="transparent" data-col="' + i + '"/>';
  });
  box.innerHTML = title + '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="กราฟแนวโน้มรายจ่ายและรายได้">' + g + '</svg><div class="tip" hidden></div></div>' +
    '<div class="legend">' + ['ใช้จ่ายจริง','ออมและลงทุน','ผ่อนหนี้'].map(function(k){ return '<span><i class="sw" style="background:' + GROUP_COLOR[k] + '"></i>' + k + '</span>'; }).join('') +
    '<span><i class="ln" style="border-color:var(--ink)"></i>รายได้จริง</span></div>' +
    (cols.some(function(c){ return c.open; }) ? '<p class="note">แท่งจาง = ' + ovWord() + 'ปัจจุบัน (ยังไม่จบ นับถึงวันนี้)</p>' : '') +
    tableBox('trend', '<tr><th>' + ovWord() + '</th><th>รายได้จริง</th><th>ใช้จ่ายจริง</th><th>ออม/ลงทุน</th><th>ผ่อนหนี้</th></tr>' + cols.slice().reverse().map(function(c){
      return '<tr><td>' + escapeHtml(shortLabel(S.ovMode, c.p) + ' ' + String(isoParts(c.p.start)[0] + 543).slice(2)) + (c.open ? '*' : '') + '</td><td>' + fmtMoney(c.f.realInc) + '</td><td>' + fmtMoney(c.f.spend) + '</td><td>' + fmtMoney(c.f.save) + '</td><td>' + fmtMoney(c.f.debt) + '</td></tr>';
    }).join(''));
  var svg = box.querySelector('svg'), tip = box.querySelector('.tip');
  function show(i){
    var c = cols[i]; if (!c) return;
    var r = svg.getBoundingClientRect();
    tip.innerHTML = '<div class="h">' + escapeHtml(c.p.label) + (c.open ? ' (ถึงวันนี้)' : '') + '</div>' +
      [['รายได้จริง', c.f.realInc, 'var(--ink)'], ['ใช้จ่ายจริง', c.f.spend, GROUP_COLOR['ใช้จ่ายจริง']], ['ออมและลงทุน', c.f.save, GROUP_COLOR['ออมและลงทุน']], ['ผ่อนหนี้', c.f.debt, GROUP_COLOR['ผ่อนหนี้']]].map(function(v){
        return '<div class="r"><i style="border-color:' + v[2] + '"></i>' + v[0] + '<b>' + fmtMoney(v[1]) + '</b></div>'; }).join('') +
      '<div class="r" style="margin-top:2px">รวมจ่าย<b>' + fmtMoney(c.f.exp) + '</b></div>';
    tip.hidden = false;
    var px = (L + band * i + band / 2) / W * r.width;
    tip.style.top = '0px';
    tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, px - tip.offsetWidth / 2)) + 'px';
  }
  svg.addEventListener('pointerdown', function(e){ var t = e.target.closest('[data-col]'); if (t) show(Number(t.dataset.col)); });
  svg.addEventListener('pointermove', function(e){ if (e.pointerType !== 'mouse') return; var t = e.target.closest('[data-col]'); if (t) show(Number(t.dataset.col)); });
  svg.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') tip.hidden = true; });
}

/* ---------- เริ่มต้นแอป (หลังตั้งค่าเครื่องแล้ว) ---------- */
/* หมวดและรอบเงินเดือนจำไว้ในเครื่อง (ไม่มีจำนวนเงิน) เพื่อให้เปิดแอปแล้วกรอกได้ทันทีไม่ต้องรอชีต */
function saveLiteBoot(){
  if (!S.boot || !S.bootLive) return;
  LS.set('boot', JSON.stringify({ v:1, version:S.boot.version, cats:S.boot.cats, cycles:S.boot.cycles, defaultMode:S.boot.defaultMode }));
}
function readLiteBoot(){
  try {
    var b = JSON.parse(LS.get('boot') || 'null');
    if (!b || b.v !== 1 || !Array.isArray(b.cats) || !b.cats.length) return null;
    return { version:b.version, cats:b.cats, cycles:b.cycles || [], defaultMode:b.defaultMode, today:deviceToday(),
             template:null, lastAmount:{}, usage:{}, coopPrincipal:0, lite:true };
  } catch(e){ return null; }
}

function catMap(cats){ var m = {}; cats.forEach(function(c){ m[c.id] = c; }); return m; }
function useBoot(boot){
  var first = !S.boot;
  S.boot = boot; S.cat = {};
  boot.cats.forEach(function(c){ S.cat[c.id] = c; });
  if (first){
    S.anchor = boot.today;
    S.listMode = boot.defaultMode === 'เดือนปฏิทิน' ? 'month' : 'cycle';
    var om = LS.get('ovMode');
    S.ovMode = om === 'month' || om === 'cycle' ? om : S.listMode;
    S.ovAnchor = boot.today;
    $('loading').hidden = true; $('v-add').hidden = false;
    S.addForm = makeForm($('addForm'), {}, {prefix:'a_', onDone:function(item){ dayDate = item.date; refreshDay(); }, onDate:function(d){ dayDate = d; refreshDay(); }});
  } else if (S.addForm && S.addForm.pristine() && !$('addForm').contains(document.activeElement)){
    S.addForm.redraw();   // อัปเดตลำดับปุ่มใช้ประจำ ถ้ายังไม่ได้เริ่มกรอก
  }
}

function bootBar(msg, retry){
  var b = $('bootBar');
  if (!msg){ b.hidden = true; b.innerHTML = ''; return; }
  b.hidden = false; b.className = 'note-bar' + (retry ? ' bad' : '');
  b.innerHTML = '<span>' + escapeHtml(msg) + '</span>' + (retry ? '<button id="bootRetry">ลองใหม่</button>' : '');
  if (retry) $('bootRetry').onclick = function(){ bootBar('กำลังโหลดข้อมูลล่าสุด…'); loadBoot(); };
}

/** ขอข้อมูลตั้งต้นจากชีต (รอบเดียวได้ทั้งหมวด ชุดเงินเดือน และรายการของรอบ/เดือนปัจจุบัน) */
var bootSeq = 0;
function loadBoot(){
  var seq = ++bootSeq, startedAt = Date.now();
  S.bootPending = true;
  return call('getBootstrap').then(function(boot){
    if (seq !== bootSeq) return;
    S.bootPending = false;
    S.bootLive = true; S.bootAt = Date.now();
    if (dayDate && S.boot && dayDate === S.boot.today && boot.today !== S.boot.today) dayDate = null;
    var pendTpl = S.outbox.filter(function(en){ return en.kind === 'tpl'; }).pop();
    if (pendTpl) boot.template = templateLocal(pendTpl.rows, catMap(boot.cats));
    useBoot(boot);
    if (boot.recent) storeMerge(S.store, boot.recent.start, boot.recent.end, boot.recent.items, startedAt);
    saveLiteBoot();
    bootBar('');
    rerender();
    flushOutbox();
    // โหลดรอบ/เดือนก่อนหน้าไว้ล่วงหน้า (กดย้อนดูแล้วขึ้นทันที)
    if (boot.recent) setTimeout(function(){
      var pc = periodRange('cycle', shiftAnchor('cycle', boot.today, -1, boot.cycles, boot.today), boot.cycles, boot.today, null);
      var pm = periodRange('month', addMonths(boot.today, -1), boot.cycles, boot.today, null);
      prefetch(pc.start < pm.start ? pc.start : pm.start, addDays(boot.recent.start, -1));
    }, 1200);
  }).catch(function(err){
    if (seq !== bootSeq) return;
    S.bootPending = false;
    if (err.code === 'AUTH') return;
    if (S.boot){ rerender(); bootBar('โหลดข้อมูลล่าสุดไม่สำเร็จ (' + err.message + ') กรอกต่อได้ รายการจะรอส่งให้', true); return; }
    S.started = false;
    $('loading').innerHTML = '<div class="err-box">โหลดข้อมูลไม่สำเร็จ: ' + escapeHtml(err.message) + '</div>' +
      '<button class="ghost" id="btnRetry" style="margin-top:12px">ลองใหม่</button>';
    var b = $('btnRetry'); if (b) b.onclick = function(){ $('loading').innerHTML = skeletonHtml(3); startApp(); };
  });
}

function startApp(){
  if (S.started) return;
  S.started = true;
  loadOutbox();
  if (!S.boot){
    var lite = readLiteBoot();
    if (lite){ useBoot(lite); refreshDay(); syncBadge(); }
  }
  loadBoot();
}

/** กลับเข้าแอป (ปลดล็อก/สลับกลับมา): ส่งคิวที่ค้าง และขอของใหม่ถ้าข้อมูลเก่าหรือข้ามวันแล้ว */
function resumeApp(){
  if (!S.started || !S.boot) return;
  S.retryDelay = 0; flushOutbox();
  if (S.bootPending) return;
  if (deviceToday() !== S.boot.today || Date.now() - S.bootAt > 30 * 60000) loadBoot();
  else rerender();
}
window.addEventListener('online', function(){ S.retryDelay = 0; flushOutbox(); });

var G = $('gate');
function gateShow(html){

function randHex(n){ var a = new Uint8Array(n); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(b){ return (b < 16 ? '0' : '') + b.toString(16); }).join(''); }
function hashPin(pin, salt){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:enc.encode(salt), iterations:150000 }, k, 256);
  }).then(function(bits){ return b64u(bits); });
}

function bioAvailable(){
  if (!window.PublicKeyCredential || !PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) return Promise.resolve(false);
  return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function(){ return false; });
}
function bioOn(){ return LS.get('bio') === '1' && !!LS.get('cred'); }
function bioRegister(){
  var uid = new Uint8Array(16), ch = new Uint8Array(32);
  crypto.getRandomValues(uid); crypto.getRandomValues(ch);
  return navigator.credentials.create({ publicKey:{
    challenge:ch, rp:{ name:'จดเงินของเบ๊บ' },
    user:{ id:uid, name:'จดเงินของเบ๊บ', displayName:'จดเงินของเบ๊บ' },
    pubKeyCredParams:[{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
    authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged', requireResidentKey:false },
    timeout:60000, attestation:'none' } }).then(function(cred){
      if (!cred) throw new Error('ไม่ได้ตั้งลายนิ้วมือ');
      LS.set('cred', b64u(cred.rawId)); LS.set('bio', '1');
    });
}
function bioVerify(){
  var id = LS.get('cred');
  if (!id) return Promise.reject(new Error('ยังไม่ได้ตั้งลายนิ้วมือ'));
  var ch = new Uint8Array(32); crypto.getRandomValues(ch);
  return navigator.credentials.get({ publicKey:{ challenge:ch, allowCredentials:[{ type:'public-key', id:unb64u(id) }],
    userVerification:'required', timeout:60000 } }).then(function(a){
      if (!a || b64u(a.rawId) !== id) throw new Error('ข้อมูลยืนยันไม่ตรงกับที่ตั้งไว้');
      var ad = new Uint8Array(a.response.authenticatorData);
      if (ad.length < 33 || !(ad[32] & 0x04)) throw new Error('เครื่องไม่ได้ยืนยันลายนิ้วมือหรือใบหน้า');
    });
}
function bioErrMsg(e){
  if (e && e.name === 'NotAllowedError') return 'ยกเลิกหรือหมดเวลา ลองอีกครั้ง หรือใช้ PIN';
  if (e && e.name === 'SecurityError') return 'เบราว์เซอร์ไม่อนุญาตบนหน้านี้ (ต้องเปิดผ่าน https)';
  return (e && e.message) || 'ใช้ลายนิ้วมือไม่ได้';
}

/** หน้าล็อก */
var autoBioTimer = null;
function gateLock(){
  S.unlocked = false;
  var bio = bioOn();
  gateShow('<div class="logo">🔒</div><h2>จดเงินของเบ๊บ</h2>' +
    (bio ? '<button class="primary" id="gBio">👆 ปลดล็อกด้วยลายนิ้วมือ / Face ID</button>' : '') +
    '<form id="gForm"><div class="label center">' + (bio ? 'หรือใส่ PIN' : 'ใส่ PIN') + '</div>' +
    '<input class="field pin" id="gPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">' +
    '<button class="ghost" type="submit" id="gGo" style="width:100%;margin-top:10px">ปลดล็อกด้วย PIN</button></form>' +
    '<div class="err-box center" id="gErr"></div>' +
    '<button class="linkbtn" id="gReset">ลืม PIN / ตั้งค่าเครื่องนี้ใหม่</button>');
  function tryBio(silent){
    bioVerify().then(unlocked).catch(function(err){ if (!silent) gErr(bioErrMsg(err)); });
  }
  G.onclick = function(e){
    var id = e.target.id;
    if (id === 'gBio') return tryBio(false);
    if (id === 'gReset'){
      if (!e.target.dataset.sure){ e.target.dataset.sure = '1'; e.target.textContent = 'แตะอีกครั้งเพื่อล้างการตั้งค่า (ข้อมูลในชีตไม่หาย ต้องวางกุญแจใหม่)'; return; }
      wipeDevice(); S.api = S.key = null; S.started = false; gateSetup('');
    }
  };
  G.oninput = function(e){ if (e.target.id === 'gPin' && e.target.value.length === 6) G.onsubmit({ preventDefault:function(){} }); };
  G.onsubmit = function(e){
    e.preventDefault();
    var input = $('gPin'), pin = input.value;
    var fails = Number(LS.get('fails')) || 0, until = Number(LS.get('failUntil')) || 0;
    if (Date.now() < until){ input.value = ''; return gErr('ใส่ PIN ผิดหลายครั้ง ลองใหม่ได้ในอีก ' + Math.ceil((until - Date.now())/1000) + ' วินาที'); }
    if (!/^\d{6}$/.test(pin)) return gErr('PIN ต้องเป็นตัวเลข 6 หลัก');
    $('gGo').disabled = true;
    hashPin(pin, LS.get('pinSalt') || '').then(function(h){
      $('gGo').disabled = false; input.value = '';
      if (h === LS.get('pinHash')) return unlocked();
      fails++;
      if (fails >= MAX_PIN_FAILS){
        wipeDevice(); S.api = S.key = null; S.started = false;
        return gateSetup('ใส่ PIN ผิด ' + MAX_PIN_FAILS + ' ครั้ง ระบบล้างกุญแจออกจากเครื่องนี้แล้ว ข้อมูลในชีตไม่หาย วางกุญแจเพื่อตั้งค่าใหม่');
      }
      LS.set('fails', fails);
      var wait = lockoutMs(fails);
      if (wait) LS.set('failUntil', Date.now() + wait);
      gErr('PIN ไม่ถูกต้อง (ผิด ' + fails + '/' + MAX_PIN_FAILS + ' ครั้ง)' + (wait ? ' รอ ' + (wait/1000) + ' วินาทีก่อนลองใหม่' : ''));
    }).catch(function(err){ $('gGo').disabled = false; gErr(err.message); });
  };
  clearTimeout(autoBioTimer);
  if (bio) autoBioTimer = setTimeout(function(){ if (!S.unlocked && !G.hidden) tryBio(true); }, 350);
}

/* ---------- ทดสอบความเร็ว: แยกเวลาเดินทาง (เน็ต + ระบบ Google) กับเวลาที่สคริปต์ทำงานจริง ---------- */
function speedTest(){
  var sh = openSheet(1, '<h2>⚡ ทดสอบความเร็ว</h2><p class="muted small">ใช้เวลาราว 10–20 วินาที ไม่บันทึกหรือแก้ข้อมูลใด ๆ</p>' +
    '<div class="perf card" id="spOut">' + skeletonHtml(3) + '</div><button class="ghost" style="width:100%" id="spClose">ปิด</button>');
  sh.onclick = function(e){ if (e.target.id === 'spClose') closeSheet(1); };
  var rows = [];
  function sec(ms){ return ms == null ? '–' : (ms / 1000).toFixed(2) + ' วิ'; }
  function timed(action, args){
    var t0 = performance.now();
    return call.apply(null, [action].concat(args || [])).then(function(res){
      var last = S.perf[S.perf.length - 1] || {};
      return { rtt:Math.round(performance.now() - t0), ms:last.ms, res:res };
    });
  }
  function avg(a){ return a.length ? Math.round(a.reduce(function(x, y){ return x + y; }, 0) / a.length) : null; }
  var pings = [], server = null, list = null;
  var today = S.boot ? S.boot.today : deviceToday();
  timed('ping').then(function(r){ pings.push(r); return timed('ping'); })
    .then(function(r){ pings.push(r); return timed('ping'); })
    .then(function(r){ pings.push(r); return timed('speedTest').catch(function(){ return null; }); })
    .then(function(r){ server = r; return timed('listTransactions', [today, today]); })
    .then(function(r){ list = r; })
    .then(function(){
      var pr = avg(pings.map(function(p){ return p.rtt; })), pm = avg(pings.filter(function(p){ return p.ms != null; }).map(function(p){ return p.ms; }));
      rows.push(['เรียกเปล่า ไม่แตะชีต (เฉลี่ย 3 ครั้ง)', sec(pr)]);
      rows.push(['· ในนั้นสคริปต์ทำงานจริง', sec(pm)]);
      rows.push(['· ที่เหลือคือเดินทาง (เน็ต + ระบบ Google)', pm == null ? '–' : sec(pr - pm)]);
      if (server && server.res){
        rows.push(['อ่านแท็บรายการ ' + server.res.rows.toLocaleString() + ' แถว (ฝั่ง Google)', sec(server.res.readMs)]);
        rows.push(['เรียกแบบอ่านทั้งแท็บ ไป-กลับ', sec(server.rtt)]);
      } else rows.push(['ทดสอบฝั่ง Google', 'ต้องอัปเดต Code.gs ก่อน']);
      rows.push(['ดึงรายการวันนี้ ไป-กลับ', sec(list.rtt)]);
      var recent = S.perf.filter(function(p){ return ['getBootstrap','addTransactions','listTransactions','updateTransaction','deleteTransaction'].indexOf(p.action) >= 0; }).slice(-6);
      var NAMES = { getBootstrap:'โหลดตอนเปิดแอป', addTransactions:'ส่งรายการเข้าชีต', listTransactions:'ดึงรายการ', updateTransaction:'แก้รายการ', deleteTransaction:'ลบรายการ' };
      $('spOut').innerHTML = '<table>' + rows.map(function(r){ return '<tr><td>' + escapeHtml(r[0]) + '</td><td><b>' + escapeHtml(r[1]) + '</b></td></tr>'; }).join('') + '</table>' +
        (recent.length ? '<div class="grp">ที่แอปเพิ่งเรียกจริง (ไป-กลับ / สคริปต์ทำงาน)</div><table>' + recent.map(function(p){
          return '<tr><td>' + escapeHtml(NAMES[p.action] || p.action) + (p.ok ? '' : ' (ไม่สำเร็จ)') + '</td><td>' + sec(p.rtt) + ' / ' + sec(p.ms) + '</td></tr>'; }).join('') + '</table>' : '') +
        '<p class="muted small">แคปหน้าจอนี้ส่งให้ผู้ช่วยได้ ถ้า "เดินทาง" กินเวลาส่วนใหญ่ แปลว่าช้าที่เน็ตหรือระบบของ Google ซึ่งแอปแก้ด้วยการไม่ให้รอ (บันทึกขึ้นก่อน ส่งทีหลัง)</p>';
    }).catch(function(err){ $('spOut').innerHTML = '<div class="err-box">ทดสอบไม่สำเร็จ: ' + escapeHtml(err.message) + '</div>'; });
}

  h += '<p class="note" style="margin:0 2px 14px">ยอด ณ วันใด = ยอดล่าสุดของแต่ละรายการถึงวันนั้น · ประวัติที่นำเข้าจาก Happy Money แก้ได้ในชีตเท่านั้น ส่วนที่กรอกในแอปแก้/ลบได้จากหน้าประวัติของรายการ</p>';
  box.innerHTML = h;

    pts.slice().reverse().map(function(p){ return '<tr><td>' + escapeHtml(p.full) + (p.open ? ' (ถึงวันนี้)' : '') + '</td><td>' + fmtMoney(p.asset) + '</td><td>' + fmtMoney(p.liab) + '</td><td>' + fmtMoney(p.net) + '</td></tr>'; }).join('') + '</table></details>';
